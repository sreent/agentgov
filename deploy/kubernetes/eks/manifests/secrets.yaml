# The Secret the chart reads, synced from the Secrets Manager secret agentgov by the
# External Secrets Operator, with the operator's own EKS Pod Identity (docs/deploy/aws.md).
# The guide replaces <region> with your region.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgov
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: agentgov
spec:
  provider:
    aws:
      service: SecretsManager
      region: <region>
---
# The secret is a JSON object whose keys are the chart's: admin-token, service-token,
# signing-secret, keycloak-client-secret, oidc-client-secret, keycloak-admin-password,
# database-url and keycloak-database-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgov
  namespace: agentgov
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: agentgov
  dataFrom:
    - extract: {key: agentgov}
