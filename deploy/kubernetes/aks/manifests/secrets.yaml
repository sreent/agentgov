# The Secret the chart reads, synced from Azure Key Vault by the External Secrets
# Operator (docs/deploy/azure.md). The guide replaces <client-id>, <tenant-id> and
# <keyvault> with your names.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgov
---
# Bound to the managed identity agentgov through a federated credential. The Key Vault
# certificate of the Gateway's listeners is read with it too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgov-azure
  namespace: agentgov
  annotations:
    azure.workload.identity/client-id: <client-id>
    azure.workload.identity/tenant-id: <tenant-id>
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: agentgov
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://<keyvault>.vault.azure.net
      serviceAccountRef:
        name: agentgov-azure
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgov
  namespace: agentgov
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-key-vault
  target:
    name: agentgov
  data:
    - {secretKey: admin-token, remoteRef: {key: agentgov-admin-token}}
    - {secretKey: service-token, remoteRef: {key: agentgov-service-token}}
    - {secretKey: signing-secret, remoteRef: {key: agentgov-signing-secret}}
    - {secretKey: keycloak-client-secret, remoteRef: {key: agentgov-keycloak-client-secret}}
    - {secretKey: oidc-client-secret, remoteRef: {key: agentgov-oidc-client-secret}}
    - {secretKey: keycloak-admin-password, remoteRef: {key: agentgov-keycloak-admin-password}}
    - {secretKey: database-url, remoteRef: {key: agentgov-database-url}}
    - {secretKey: keycloak-database-password, remoteRef: {key: agentgov-keycloak-database-password}}
