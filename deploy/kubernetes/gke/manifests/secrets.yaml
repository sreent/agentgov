# The Secret the chart reads, synced from Secret Manager by the External Secrets Operator,
# with the operator's own Workload Identity (docs/deploy/gcp.md). The guide replaces
# <project> with your project ID.
apiVersion: v1
kind: Namespace
metadata:
  name: agentgov
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: google-secret-manager
  namespace: agentgov
spec:
  provider:
    gcpsm:
      projectID: <project>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgov
  namespace: agentgov
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: google-secret-manager
  target:
    name: agentgov
  data:
    - {secretKey: admin-token, remoteRef: {key: agentgov-admin-token}}
    - {secretKey: service-token, remoteRef: {key: agentgov-service-token}}
    - {secretKey: keycloak-client-secret, remoteRef: {key: agentgov-keycloak-client-secret}}
    - {secretKey: oidc-client-secret, remoteRef: {key: agentgov-oidc-client-secret}}
    - {secretKey: keycloak-admin-password, remoteRef: {key: agentgov-keycloak-admin-password}}
    - {secretKey: database-url, remoteRef: {key: agentgov-database-url}}
    - {secretKey: keycloak-database-password, remoteRef: {key: agentgov-keycloak-database-password}}
