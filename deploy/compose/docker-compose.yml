# AgentGov reference stack: an open-source take on Microsoft Agent 365, composed
# from established projects. See docs/architecture.md.
#
#   docker compose up -d --build
#
# Host ports: control plane + UI :8000, MCP gateway :8080, Keycloak :8180,
# OPA :8181, OTLP :4317/:4318, the demo's stand-ins for a workload issuer :9200 and
# for the security team's tools :9300. The demo MCP server is only reachable through
# the gateway. The defaults below are for local evaluation only - set real
# secrets in a .env file (see .env.example) for anything else.

x-agentgov-env: &agentgov-env
  AGENTGOV_SERVICE_TOKEN: ${AGENTGOV_SERVICE_TOKEN:-dev-service-token}
  AGENTGOV_OPA_URL: https://opa:8181
  # Each component's certificate, for mutual TLS with the others (docs/architecture.md):
  # its own directory of the certs volume, at /tls.
  AGENTGOV_TLS_DIR: /tls

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentgov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentgov}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgov -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Agent identity (the open Entra Agent ID): one OAuth client per agent.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: agentgov
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-agentgov}
      # Tokens always carry this issuer; containers reach Keycloak at keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # SPIFFE identity issuers need this preview feature (docs/agent-identity.md).
      KC_FEATURES: spiffe
      AGENTGOV_KEYCLOAK_CLIENT_SECRET: ${AGENTGOV_KEYCLOAK_CLIENT_SECRET:-dev-keycloak-secret}
      # Imported into the realm: the admin sign-in client and the demo users' password.
      AGENTGOV_OIDC_CLIENT_SECRET: ${AGENTGOV_OIDC_CLIENT_SECRET:-dev-oidc-secret}
      AGENTGOV_DEMO_PASSWORD: ${AGENTGOV_DEMO_PASSWORD:-dev-password}
    volumes:
      - ./keycloak/agentgov-realm.json:/opt/keycloak/data/import/agentgov-realm.json:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  # Registry, lifecycle, reconcilers, evidence ledger, admin UI (ours).
  control-plane:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: agentgov:local
    command: ["server"]
    environment:
      <<: *agentgov-env
      AGENTGOV_DATABASE_URL: postgresql+psycopg://agentgov:${POSTGRES_PASSWORD:-agentgov}@postgres:5432/agentgov
      AGENTGOV_PUBLIC_URL: ${AGENTGOV_PUBLIC_URL:-http://localhost:8000}
      AGENTGOV_ADMIN_TOKEN: ${AGENTGOV_ADMIN_TOKEN:-dev-admin-token}
      AGENTGOV_KEYCLOAK_URL: http://keycloak:8080
      AGENTGOV_KEYCLOAK_CLIENT_SECRET: ${AGENTGOV_KEYCLOAK_CLIENT_SECRET:-dev-keycloak-secret}
      AGENTGOV_KEYCLOAK_ISSUER: http://localhost:8180/realms/agentgov
      AGENTGOV_KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/agentgov/protocol/openid-connect/certs
      # The apps people use agents from (Keycloak clients), offered each agent's client
      # scope so that agents can act for the people signed in (docs/acting-for-people.md).
      AGENTGOV_PEOPLE_APP_CLIENTS: ${AGENTGOV_PEOPLE_APP_CLIENTS:-agentgov-demo-chat}
      # Administrator single sign-on through Keycloak (client agentgov-admin), or through
      # Microsoft Entra ID when AGENTGOV_OIDC_ISSUER names an Entra tenant (docs/platforms.md).
      AGENTGOV_OIDC_ISSUER: ${AGENTGOV_OIDC_ISSUER:-}
      AGENTGOV_OIDC_CLIENT_ID: ${AGENTGOV_OIDC_CLIENT_ID:-}
      AGENTGOV_OIDC_CLIENT_SECRET: ${AGENTGOV_OIDC_CLIENT_SECRET:-dev-oidc-secret}
      AGENTGOV_OIDC_ROLES_CLAIM: ${AGENTGOV_OIDC_ROLES_CLAIM:-}
      AGENTGOV_MICROSOFT_ADMIN_ACTIONS: ${AGENTGOV_MICROSOFT_ADMIN_ACTIONS:-}
      AGENTGOV_GATEWAY_PUBLIC_URL: http://localhost:8080
      AGENTGOV_GATEWAY_OTLP_ENDPOINT: http://otel-collector:4317
      AGENTGOV_PROCESSOR_ADDRESS: processor:50051
      AGENTGOV_POSTURE_INTERVAL_SECONDS: "60"
      # The authority that time-stamps the ledger's checkpoints (docs/evidence.md): the demo
      # sink stands in for one. A real one is, for example, https://freetsa.org/tsr.
      AGENTGOV_LEDGER_TSA_URL: ${AGENTGOV_LEDGER_TSA_URL:-http://demo-sink:9300/tsa}
      # Features the deployment pins, e.g. "least-privilege=monitor" (docs/features.md).
      # Administrators choose the others on the Features page.
      AGENTGOV_FEATURES: ${AGENTGOV_FEATURES:-}
      # AgentGov's Microsoft app registration: the Microsoft 365 agent catalog, Entra Agent
      # ID, the Purview audit log and Defender alerts, each with its own permission
      # (docs/microsoft-connections.md). Off while these are empty.
      AGENTGOV_M365_TENANT_ID: ${AGENTGOV_M365_TENANT_ID:-}
      AGENTGOV_M365_CLIENT_ID: ${AGENTGOV_M365_CLIENT_ID:-}
      AGENTGOV_M365_CLIENT_SECRET: ${AGENTGOV_M365_CLIENT_SECRET:-}
      AGENTGOV_M365_SYNC_INTERVAL_SECONDS: ${AGENTGOV_M365_SYNC_INTERVAL_SECONDS:-3600}
      # Copilot Studio asks AgentGov's policies before each tool call, once the feature
      # copilot-studio-threat-detection is on (monitor or enforce).
      AGENTGOV_COPILOT_STUDIO_CALLER_APP_IDS: ${AGENTGOV_COPILOT_STUDIO_CALLER_APP_IDS:-}
      AGENTGOV_COPILOT_STUDIO_TENANT_ID: ${AGENTGOV_COPILOT_STUDIO_TENANT_ID:-}
      AGENTGOV_COPILOT_STUDIO_AUDIENCES: ${AGENTGOV_COPILOT_STUDIO_AUDIENCES:-}
      AGENTGOV_COPILOT_STUDIO_ON_ERROR: ${AGENTGOV_COPILOT_STUDIO_ON_ERROR:-block}
      # IBM Granite Guardian for agent instructions (docs/instructions.md), as the processor
      # asks it about traffic (docs/detection.md); see docker-compose.guardian.yml.
      AGENTGOV_GUARDIAN_URL: ${AGENTGOV_GUARDIAN_URL:-}
      AGENTGOV_GUARDIAN_API_KEY: ${AGENTGOV_GUARDIAN_API_KEY:-}
      # Destinations' credentials (docs/secops.md): a file per destination, named after it.
      AGENTGOV_DESTINATION_SECRETS_DIR: /destination-secrets
      # The key it signs OPA's bundles with (OPA refuses one that doesn't verify).
      AGENTGOV_BUNDLE_SIGNING_KEY_FILE: /tls/bundle-signing/key.pem
    volumes:
      - ${AGENTGOV_DESTINATION_SECRETS_DIR:-./destination-secrets}:/destination-secrets:ro
      - {type: volume, source: certs, target: /tls, read_only: true, volume: {subpath: control-plane}}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # AgentGov's own certificate authority and a certificate for each component, for mutual
  # TLS between them, and the key the control plane signs OPA's bundles with: made on the
  # first start, on a volume of their own, and kept. Each component mounts its own only.
  certs:
    image: agentgov:local
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >-
        agentgov internal-certs /certs
        && agentgov bundle-signing-key /certs/control-plane/bundle-signing
        && cp /certs/control-plane/bundle-signing/cert.pem /certs/opa/bundle.crt
        && chmod a+r /certs/*/tls.key /certs/control-plane/bundle-signing/key.pem
    volumes:
      - certs:/certs

  # Policy decision point: Rego library + registry data, served by the control plane.
  opa:
    image: openpolicyagent/opa:1.21.1-static
    # Over mutual TLS: callers show a certificate from AgentGov's authority.
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--config-file=/config/opa.yaml", "--log-level=info",
              "--tls-cert-file=/tls/tls.crt", "--tls-private-key-file=/tls/tls.key",
              "--tls-ca-cert-file=/tls/ca.crt", "--authentication=tls",
              "--set-file=keys.agentgov.key=/tls/bundle.crt"]
    environment:
      <<: *agentgov-env
    volumes:
      - ./opa/config.yaml:/config/opa.yaml:ro
      - {type: volume, source: certs, target: /tls, read_only: true, volume: {subpath: opa}}
    ports:
      - "8181:8181"
    depends_on:
      control-plane:
        condition: service_healthy

  # PII detection (the open Purview DLP classifier).
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364@sha256:ae8f6f111ac2f04e3fec552f7f80edd0dcbfa2dd69ee1b9e030475be31669885
    environment:
      WORKERS: "2"
      REGEX_TIMEOUT_SECONDS: "2"
      TLDEXTRACT_CACHE_TIMEOUT: "1"

  # agentgateway's ExtMcp policy server: content inspection, OPA decisions, approvals (ours).
  processor:
    image: agentgov:local
    command: ["processor"]
    environment:
      <<: *agentgov-env
      AGENTGOV_CONTROL_PLANE_URL: https://control-plane:8443
      AGENTGOV_PRESIDIO_URL: http://presidio-analyzer:3000
      # IBM Granite Guardian's second opinion on traffic (docs/detection.md).
      AGENTGOV_GUARDIAN_URL: ${AGENTGOV_GUARDIAN_URL:-}
      AGENTGOV_GUARDIAN_API_KEY: ${AGENTGOV_GUARDIAN_API_KEY:-}
    volumes:
      - {type: volume, source: certs, target: /tls, read_only: true, volume: {subpath: processor}}
    depends_on:
      control-plane:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      opa:
        condition: service_started

  # Keeps agentgateway's configuration current from the control plane, after checking
  # that the gateway can read each model provider's key (as the Helm chart's sidecar).
  gateway-config:
    image: agentgov:local
    command: ["gateway-config", "--output", "/gateway/config.yaml", "--interval", "2"]
    environment:
      <<: *agentgov-env
      AGENTGOV_CONTROL_PLANE_URL: https://control-plane:8443
    volumes:
      - gateway-config:/gateway
      - ${AGENTGOV_MODEL_KEYS_DIR:-./model-keys}:/model-keys:ro
      - {type: volume, source: certs, target: /tls, read_only: true, volume: {subpath: gateway}}
    healthcheck:
      test: ["CMD", "test", "-s", "/gateway/config.yaml"]
      interval: 2s
      retries: 60
    depends_on:
      control-plane:
        condition: service_healthy

  # Policy enforcement point for tool calls (MCP) and model calls. Its config is generated
  # by the control plane; model providers' API keys are files in ./model-keys.
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.6.0
    command: ["-f", "/gateway/config.yaml"]
    volumes:
      - gateway-config:/gateway:ro
      - ${AGENTGOV_MODEL_KEYS_DIR:-./model-keys}:/model-keys:ro
      - {type: volume, source: certs, target: /tls, read_only: true, volume: {subpath: gateway}}
    ports:
      - "8080:8080"
    depends_on:
      gateway-config:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      processor:
        condition: service_started
      # Restarted with the collector (e.g. by the Langfuse override): agentgateway
      # resolves the collector's address once, at startup.
      otel-collector:
        condition: service_started
        restart: true
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      <<: *agentgov-env
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - {type: volume, source: certs, target: /tls, read_only: true, volume: {subpath: otel-collector}}
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      control-plane:
        condition: service_healthy

  # Demo MCP server (only reachable through the gateway).
  crm-mcp:
    build:
      context: ../../examples/mcp-servers/crm
    image: agentgov-demo-crm:local

  # Demo model provider, OpenAI-compatible (only reachable through the gateway). It
  # accepts only the key in ./model-keys/demo, which the gateway holds.
  demo-model:
    build:
      context: ../../examples/models/mock
    image: agentgov-demo-model:local
    environment:
      MOCK_MODEL_KEY: demo-model-key

  # Demo workload identity issuer: a stand-in Kubernetes cluster whose service account
  # tokens agents authenticate with instead of a client secret. Keycloak reads its keys
  # at workload-issuer:9200; the demo gets tokens from it on port 9200.
  workload-issuer:
    build:
      context: ../../examples/identity/workload-issuer
    image: agentgov-demo-issuer:local
    environment:
      ISSUER: http://workload-issuer:9200
    ports:
      - "9200:9200"

  # Demo agent that other agents call over A2A, only through the gateway (at
  # /a2a/billing-agent). It has no secret: it authenticates with its service account
  # token from the workload issuer, and looks customers up in the CRM through the gateway.
  billing-agent:
    build:
      context: ../../examples/agents/billing
    image: agentgov-demo-billing:local
    environment:
      GATEWAY_URL: http://agentgateway:8080
      TOKEN_URL: http://keycloak:8080/realms/agentgov/protocol/openid-connect/token
      ASSERTION_AUDIENCE: http://localhost:8180/realms/agentgov
      WORKLOAD_ISSUER: http://workload-issuer:9200

  # Demo stand-in for the security team's tools: it receives OCSF events as a SIEM (OTLP,
  # Splunk's HTTP Event Collector) and alerts as Slack and Teams do, and shows them at
  # localhost:9300/received.
  demo-sink:
    build:
      context: ../../examples/secops/sink
    image: agentgov-demo-sink:local
    environment:
      HEC_TOKEN: demo-hec-token
    ports:
      - "9300:9300"

volumes:
  postgres-data:
  gateway-config:
  certs:
