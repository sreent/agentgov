# AgentGov as an inventory of your agents, without the gateway: the control plane and its
# database read the agents on your platforms (Microsoft 365, Copilot Studio, AWS, Google
# Cloud, Salesforce, Databricks, Microsoft Foundry), raise their findings and send them to
# the people responsible. Nothing is enforced on agents' calls, so no gateway, processor,
# OPA, Presidio or Keycloak runs: about 200 MB of memory rather than 2.5 GB.
# See docs/deploy/local.md#just-the-inventory.
#
#   docker compose -f docker-compose.inventory.yml up -d --build --wait   # from this folder
#
# It needs a .env beside this file with the bootstrap administrator's token, at least:
#
#   echo "AGENTGOV_ADMIN_TOKEN=$(openssl rand -hex 32)" > .env
#
# The admin UI and API are at http://localhost:8000, on this machine only: to reach them
# from others, put HTTPS in front, or set AGENTGOV_LISTEN_ADDRESS=0.0.0.0. Every setting
# in .env (the platforms' credentials, AGENTGOV_OIDC_* for administrators' sign-in,
# AGENTGOV_SMTP_* for issues' emails; docs/configuration.md) reaches the control plane.

name: agentgov-inventory

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentgov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentgov}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgov -d agentgov"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: agentgov:local
    command: ["server"]
    env_file:
      - path: .env
        required: false
    environment:
      AGENTGOV_DATABASE_URL: postgresql+psycopg://agentgov:${POSTGRES_PASSWORD:-agentgov}@postgres:5432/agentgov
      AGENTGOV_PUBLIC_URL: ${AGENTGOV_PUBLIC_URL:-http://localhost:8000}
      # No default: one everybody knows would let anybody who reaches the port in. Nothing
      # in this stack calls the control plane's internal endpoints, so no service token.
      AGENTGOV_ADMIN_TOKEN: ${AGENTGOV_ADMIN_TOKEN:?set AGENTGOV_ADMIN_TOKEN in .env beside docker-compose.inventory.yml (openssl rand -hex 32)}
      # The gateway's features off; inventory, findings, issues and rules on
      # (docs/features.md#starting-points). Applied once, on the first start.
      AGENTGOV_FEATURE_PRESET: ${AGENTGOV_FEATURE_PRESET:-inventory}
      # Destinations' credentials (docs/secops.md): a file per destination, named after it.
      AGENTGOV_DESTINATION_SECRETS_DIR: /destination-secrets
      # The ledger's head, kept outside PostgreSQL: a database restored from an older backup
      # shows (docs/backup.md). Its volume isn't PostgreSQL's: don't restore it with that.
      AGENTGOV_LEDGER_WITNESS_FILE: ${AGENTGOV_LEDGER_WITNESS_FILE:-/var/lib/agentgov/witness/ledger-head.json}
    volumes:
      - ${AGENTGOV_DESTINATION_SECRETS_DIR:-./destination-secrets}:/destination-secrets:ro
      - ledger-witness:/var/lib/agentgov/witness
    ports:
      - "${AGENTGOV_LISTEN_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  ledger-witness:
