# Agents and agentgateway send OTLP here. GenAI spans go to the control plane,
# which uses them for discovery (shadow agents), activity and detective controls.
# agentgateway's access logs of model calls go there too: they meter tokens and cost.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # The gateway's access logs, on a receiver of their own: what they say is billed to
  # agents and counts against their budgets, so it takes only certificates from AgentGov's
  # authority (the gateway's), not whatever can send traces.
  otlp/gateway:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        tls:
          cert_file: /tls/tls.crt
          key_file: /tls/tls.key
          client_ca_file: /tls/ca.crt
          reload_interval: 1m

processors:
  batch:
    timeout: 2s
  # Only model calls: the gateway logs every request.
  filter/model_calls:
    error_mode: ignore
    logs:
      log_record:
        - attributes["gen_ai.operation.name"] == nil

exporters:
  # The control plane's internal port, over mutual TLS.
  otlp_http/agentgov:
    endpoint: https://control-plane:8443/v1/otlp
    encoding: json
    headers:
      Authorization: "Bearer ${env:AGENTGOV_SERVICE_TOKEN}"
    tls:
      ca_file: /tls/ca.crt
      cert_file: /tls/tls.crt
      key_file: /tls/tls.key
      # A renewed certificate is read again (the authority's isn't).
      reload_interval: 1m
  # Add to the pipeline's exporters to print spans while troubleshooting.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/agentgov]
    logs:
      receivers: [otlp/gateway]
      processors: [filter/model_calls, batch]
      exporters: [otlp_http/agentgov]
