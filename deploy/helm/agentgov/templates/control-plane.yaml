{{- $name := include "agentgov.name" (list . "control-plane") }}
{{- $secret := include "agentgov.secretName" . }}
{{- $keycloak := include "agentgov.keycloakUrl" . }}
{{- $realm := include "agentgov.realm" . }}
{{- $v := .Values.controlPlane }}
{{- if and $v.ledgerArchive.enabled (gt (int $v.replicas) 1) (not $v.ledgerArchive.existingClaim) (eq $v.ledgerArchive.accessMode "ReadWriteOnce") }}
{{- fail "controlPlane.ledgerArchive with several replicas needs a volume each of them can write: set controlPlane.ledgerArchive.accessMode to ReadWriteMany (with a storageClass that offers it), or give an existingClaim" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "control-plane") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "control-plane") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
        {{- if $v.ledgerArchive.enabled }}
        # The archive volume is the control plane's to write.
        fsGroup: 10001
        {{- end }}
      {{- if and .Values.internalTLS.enabled .Values.internalTLS.spire.enabled }}
      initContainers:
        {{- include "agentgov.spireContainer" (list . false) | nindent 8 }}
      {{- end }}
      containers:
        {{- include "agentgov.spireContainer" (list . true) | nindent 8 }}
        - name: control-plane
          image: {{ include "agentgov.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
            {{- if .Values.internalTLS.enabled }}
            # For AgentGov's other components, over mutual TLS.
            - name: internal
              containerPort: 8443
            {{- end }}
          env:
            {{- include "agentgov.commonEnv" . | nindent 12 }}
            {{- include "agentgov.tlsPeersEnv" (list . (list "processor" "gateway" "opa" "otel-collector")) | nindent 12 }}
            - name: AGENTGOV_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: admin-token}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: postgres-password}
            - name: AGENTGOV_DATABASE_URL
              value: "postgresql+psycopg://agentgov:$(POSTGRES_PASSWORD)@{{ include "agentgov.name" (list . "postgresql") }}:5432/agentgov"
            {{- else }}
            - name: AGENTGOV_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgresql.enabled=false needs externalDatabase.existingSecret" .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.key }}
            {{- end }}
            - name: AGENTGOV_DATABASE_AUTO_MIGRATE
              value: {{ $v.autoMigrate | quote }}
            {{- with .Values.features }}
            - name: AGENTGOV_FEATURES
              value: {{ include "agentgov.features" $ | quote }}
            {{- end }}
            {{- with .Values.featurePreset }}
            - name: AGENTGOV_FEATURE_PRESET
              value: {{ . | quote }}
            {{- end }}
            {{- $apps := .Values.peopleApps }}
            {{- if and .Values.keycloak.enabled .Values.keycloak.demoUsers }}
            {{- $apps = append $apps "agentgov-demo-chat" }}
            {{- end }}
            {{- with $apps }}
            - name: AGENTGOV_PEOPLE_APP_CLIENTS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: AGENTGOV_PUBLIC_URL
              value: {{ .Values.urls.controlPlane | trimSuffix "/" | quote }}
            - name: AGENTGOV_GATEWAY_PUBLIC_URL
              value: {{ .Values.urls.gateway | trimSuffix "/" | quote }}
            - name: AGENTGOV_KEYCLOAK_URL
              value: {{ $keycloak | quote }}
            - name: AGENTGOV_KEYCLOAK_REALM
              value: {{ $realm | quote }}
            - name: AGENTGOV_KEYCLOAK_ISSUER
              value: {{ include "agentgov.keycloakIssuer" . | quote }}
            - name: AGENTGOV_KEYCLOAK_JWKS_URL
              value: "{{ $keycloak }}/realms/{{ $realm }}/protocol/openid-connect/certs"
            - name: AGENTGOV_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: keycloak-client-secret}
            # Administrators sign in through the same Keycloak (agentgov-admin client).
            - name: AGENTGOV_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: oidc-client-secret}
            - name: AGENTGOV_DESTINATION_SECRETS_DIR
              value: /destination-secrets
            {{- include "agentgov.guardianEnv" . | nindent 12 }}
            - name: AGENTGOV_PROCESSOR_ADDRESS
              value: "{{ include "agentgov.name" (list . "processor") }}:50051"
            - name: AGENTGOV_PROCESSOR_WEBHOOK_ADDRESS
              value: "{{ include "agentgov.name" (list . "processor") }}:8091"
            {{- if .Values.otelCollector.enabled }}
            - name: AGENTGOV_GATEWAY_OTLP_ENDPOINT
              value: "http://{{ include "agentgov.name" (list . "otel-collector") }}:4317"
            {{- end }}
            {{- if .Values.bundleSigning.enabled }}
            - name: AGENTGOV_BUNDLE_SIGNING_KEY_FILE
              value: /bundle-signing/key.pem
            {{- end }}
            {{- if $v.ledgerArchive.enabled }}
            - name: AGENTGOV_LEDGER_RETENTION_DAYS
              value: {{ $v.ledgerArchive.retentionDays | quote }}
            - name: AGENTGOV_LEDGER_ARCHIVE_DIR
              value: /ledger-archive
            {{- end }}
            {{- with $v.transparencyLog }}
            {{- if .url }}
            - name: AGENTGOV_LEDGER_REKOR_URL
              value: {{ .url | quote }}
            - name: AGENTGOV_LEDGER_REKOR_SIGNING_KEY_FILE
              value: /transparency/key.pem
            {{- if .logKey }}
            - name: AGENTGOV_LEDGER_REKOR_LOG_KEY_FILE
              value: /transparency-log/log.pub
            {{- end }}
            {{- if .origin }}
            - name: AGENTGOV_LEDGER_REKOR_ORIGIN
              value: {{ .origin | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := $v.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- with $v.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            # Migrating the database and waiting for it can take a while on first start.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: destination-secrets
              mountPath: /destination-secrets
              readOnly: true
            {{- include "agentgov.tlsMount" . | nindent 12 }}
            {{- if .Values.bundleSigning.enabled }}
            - name: bundle-signing
              mountPath: /bundle-signing
              readOnly: true
            {{- end }}
            {{- if $v.ledgerArchive.enabled }}
            - name: ledger-archive
              mountPath: /ledger-archive
            {{- end }}
            {{- if $v.transparencyLog.url }}
            - name: transparency
              mountPath: /transparency
              readOnly: true
            {{- if $v.transparencyLog.logKey }}
            - name: transparency-log
              mountPath: /transparency-log
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with $v.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        # Destinations' credentials, one per destination name. Optional: without the
        # Secret, destinations that need one report it missing until it is there.
        - name: destination-secrets
          secret:
            secretName: {{ include "agentgov.destinationSecretsSecret" . }}
            optional: true
        {{- include "agentgov.tlsVolume" (list . "control-plane") | nindent 8 }}
        {{- if .Values.bundleSigning.enabled }}
        # Only the key, out of the bundle-signing Secret.
        - name: bundle-signing
          secret:
            secretName: {{ include "agentgov.bundleSigningSecret" . }}
            items: [{key: tls.key, path: key.pem}]
        {{- end }}
        {{- if $v.ledgerArchive.enabled }}
        - name: ledger-archive
          persistentVolumeClaim:
            claimName: {{ $v.ledgerArchive.existingClaim | default (printf "%s-ledger-archive" $name) }}
        {{- end }}
        {{- if $v.transparencyLog.url }}
        {{- if not $v.transparencyLog.signingKeySecret }}
        {{- fail "controlPlane.transparencyLog.url needs signingKeySecret: a Secret with key.pem (agentgov transparency-key DIR makes one)" }}
        {{- end }}
        - name: transparency
          secret:
            secretName: {{ $v.transparencyLog.signingKeySecret }}
            items: [{key: key.pem, path: key.pem}]
        {{- if $v.transparencyLog.logKey }}
        - name: transparency-log
          configMap:
            name: {{ $name }}-transparency-log
        {{- end }}
        {{- end }}
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "control-plane") | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "agentgov.selector" (list . "control-plane") | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
    {{- if .Values.internalTLS.enabled }}
    - name: internal
      port: 8443
      targetPort: internal
    {{- end }}
{{- if and $v.ledgerArchive.enabled (not $v.ledgerArchive.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-ledger-archive
  labels:
    {{- include "agentgov.labels" (list . "control-plane") | nindent 4 }}
  annotations:
    # The archives are evidence: an uninstall leaves them.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ $v.ledgerArchive.accessMode }}]
  {{- with $v.ledgerArchive.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.ledgerArchive.size }}
{{- end }}
{{- if and .Values.controlPlane.transparencyLog.url .Values.controlPlane.transparencyLog.logKey }}
---
# The transparency log's public key, which checks its answers (no secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentgov.name" (list . "control-plane") }}-transparency-log
  labels:
    {{- include "agentgov.labels" (list . "control-plane") | nindent 4 }}
data:
  log.pub: |
    {{- .Values.controlPlane.transparencyLog.logKey | nindent 4 }}
{{- end }}
