{{- if .Values.keycloak.enabled }}
{{- $name := include "agentgov.name" (list . "keycloak") }}
{{- $secret := include "agentgov.secretName" . }}
{{- $v := .Values.keycloak }}
{{- $production := eq $v.mode "production" }}
{{- if not (has $v.mode (list "dev" "production")) }}
{{- fail "keycloak.mode is dev or production" }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not (and $v.externalDatabase.url $v.externalDatabase.existingSecret)) }}
{{- fail "keycloak.enabled with postgresql.enabled=false needs keycloak.externalDatabase.url and existingSecret: without a database, Keycloak keeps agents' clients in a file it loses when it restarts" }}
{{- end }}
{{- /* AgentGov's realm, with the sign-in redirects at the control plane's address. */}}
{{- $realm := .Files.Get "files/agentgov-realm.json" | replace "http://localhost:8000" (trimSuffix "/" .Values.urls.controlPlane) | fromJson }}
{{- if not $v.demoUsers }}
{{- $kept := list }}
{{- range $realm.users }}
{{- if hasKey . "serviceAccountClientId" }}{{ $kept = append $kept . }}{{ end }}
{{- end }}
{{- $_ := set $realm "users" $kept }}
{{- /* The demo app people sign in to with a password goes with the demo users. */}}
{{- $clients := list }}
{{- range $realm.clients }}
{{- if ne .clientId "agentgov-demo-chat" }}{{ $clients = append $clients . }}{{ end }}
{{- end }}
{{- $_ := set $realm "clients" $clients }}
{{- end }}
{{- $realmJson := toPrettyJson $realm }}
# Agent identities (one OAuth client per agent) and administrators' single sign-on.
# Keycloak imports the realm on its first start only; later changes are made in
# Keycloak itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  labels:
    {{- include "agentgov.labels" (list . "keycloak") | nindent 4 }}
data:
  agentgov-realm.json: |
    {{- $realmJson | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "keycloak") | nindent 4 }}
spec:
  {{- if $production }}
  # Replicas find each other through the database (Keycloak's jdbc-ping).
  replicas: {{ $v.replicas }}
  {{- else }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "keycloak") | nindent 8 }}
      annotations:
        checksum/realm: {{ $realmJson | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      # Keycloak reads the cluster's service account issuer keys with it.
      automountServiceAccountToken: {{ $v.mountServiceAccountToken }}
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: keycloak
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: [{{ if $production }}"start"{{ else }}"start-dev"{{ end }}, "--import-realm"]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: keycloak-admin-password}
            - {name: KC_DB, value: postgres}
            {{- if .Values.postgresql.enabled }}
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ include "agentgov.name" (list . "postgresql") }}:5432/keycloak"
            - {name: KC_DB_USERNAME, value: agentgov}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: postgres-password}
            {{- else }}
            {{- with $v.externalDatabase }}
            - {name: KC_DB_URL, value: {{ .url | quote }}}
            - {name: KC_DB_USERNAME, value: {{ .username | quote }}}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .existingSecret }}, key: {{ .passwordKey }}}
            {{- end }}
            {{- end }}
            {{- if $production }}
            # Behind a load balancer that terminates TLS and sets X-Forwarded-* headers.
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            {{- end }}
            # Tokens name this issuer; AgentGov's parts reach Keycloak at the Service.
            - name: KC_HOSTNAME
              value: {{ .Values.urls.keycloak | trimSuffix "/" | quote }}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            {{- with $v.features }}
            - {name: KC_FEATURES, value: {{ join "," . | quote }}}
            {{- end }}
            # Read by the realm import.
            - name: AGENTGOV_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: keycloak-client-secret}
            - name: AGENTGOV_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: oidc-client-secret}
            # Where Keycloak tells the control plane that a person's session ended, so their
            # AgentGov sessions end with it (back-channel logout).
            - name: AGENTGOV_BACKCHANNEL_LOGOUT_URL
              value: {{ printf "http://%s:8000/auth/backchannel-logout" (include "agentgov.name" (list . "control-plane")) | quote }}
            {{- if $v.demoUsers }}
            - name: AGENTGOV_DEMO_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: demo-password}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
            {{- if $production }}
            - {name: jgroups, containerPort: 7800}
            {{- end }}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            # Keycloak writes its build and data under /opt/keycloak.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            {{- with $v.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: realm
          configMap:
            name: {{ $name }}-realm
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "keycloak") | nindent 4 }}
spec:
  selector:
    {{- include "agentgov.selector" (list . "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
