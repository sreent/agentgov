{{- $name := include "agentgov.name" (list . "processor") }}
{{- $v := .Values.processor }}
# agentgateway's policy server: inspects every governed MCP call (ExtMcp, gRPC) and every
# prompt and answer of a model call (its guardrail webhook, HTTP), and asks OPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "processor") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "processor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "processor") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: processor
          image: {{ include "agentgov.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["processor"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: webhook
              containerPort: 8091
          env:
            {{- include "agentgov.commonEnv" . | nindent 12 }}
            - name: AGENTGOV_CONTROL_PLANE_URL
              value: {{ include "agentgov.controlPlaneUrl" . | quote }}
            {{- if .Values.presidio.enabled }}
            - name: AGENTGOV_PRESIDIO_URL
              value: "http://{{ include "agentgov.name" (list . "presidio") }}:3000"
            {{- end }}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 20
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "processor") | nindent 4 }}
spec:
  selector:
    {{- include "agentgov.selector" (list . "processor") | nindent 4 }}
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: grpc
    - name: webhook
      port: 8091
      targetPort: webhook
