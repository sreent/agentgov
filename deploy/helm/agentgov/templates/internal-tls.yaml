{{- if .Values.internalTLS.enabled }}
{{- $root := . }}
{{- $ns := .Release.Namespace }}
{{- $parts := splitList " " (include "agentgov.parts" .) }}
{{- if .Values.internalTLS.spire.enabled }}
{{- $spire := .Values.internalTLS.spire }}
{{- /* SPIRE: each component's pod gets an X.509-SVID of its own, with its Service's names,
  from SPIRE's controller manager; spiffe-helper writes it where the component reads it. */}}
{{- range $parts }}
{{- $name := include "agentgov.name" (list $root .) }}
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: {{ printf "%s-%s" $ns $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "agentgov.labels" (list $root .) | nindent 4 }}
    # A controller manager set to filterByClassName sees only the ones with its class here.
    spire.spiffe.io/class-name: {{ $spire.className }}
spec:
  className: {{ $spire.className }}
  spiffeIDTemplate: {{ include "agentgov.spiffeId" (list $root .) | quote }}
  # spiffe-helper asks for this one, whatever else the pod is given.
  hint: agentgov
  {{- with $spire.ttl }}
  ttl: {{ . }}
  {{- end }}
  namespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: {{ $ns }}}
  podSelector:
    matchLabels:
      {{- include "agentgov.selector" (list $root .) | nindent 6 }}
  dnsNameTemplates:
    - {{ $name }}
    - {{ $name }}.{{ $ns }}
    - {{ $name }}.{{ $ns }}.svc
    - {{ $name }}.{{ $ns }}.svc.cluster.local
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-spiffe-helper" (include "agentgov.fullname" .) }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
data:
  {{- range $mode := list "once" "daemon" }}
  {{ $mode }}.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/tls"
    svid_file_name = "tls.crt"
    svid_key_file_name = "tls.key"
    svid_bundle_file_name = "ca.crt"
    hint = "agentgov"
    cert_file_mode = 0644
    key_file_mode = 0600
    daemon_mode = {{ eq $mode "daemon" }}
  {{- end }}
{{- if .Values.opa.enabled }}
---
# OPA takes only the processor and the control plane, by their SPIFFE IDs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-opa-authz" (include "agentgov.fullname" .) }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
data:
  authz.rego: |
    package system.authz

    import rego.v1

    peers := {
      {{- range without $parts "opa" "gateway" "otel-collector" }}
      {{ include "agentgov.spiffeId" (list $root .) | quote }},
      {{- end }}
    }

    default allow := false

    allow if {
      some cert in input.client_certificates
      some uri in cert.URIs
      sprintf("%s://%s%s", [uri.Scheme, uri.Host, uri.Path]) in peers
    }
{{- end }}
{{- else if .Values.internalTLS.certManager.enabled }}
{{- $cm := .Values.internalTLS.certManager }}
{{- $issuer := $cm.issuerRef }}
{{- if eq $issuer.kind "ClusterIssuer" }}
{{- fail "internalTLS.certManager.issuerRef: a ClusterIssuer issues certificates to any namespace that asks, and the control plane and OPA take any certificate from its authority as one of AgentGov's components. Name an Issuer in the release's namespace whose CA issues AgentGov's certificates only, or leave issuerRef.name empty for an authority of the release's own." }}
{{- end }}
{{- if not $issuer.name }}
{{- /* An authority for this release alone: a self-signed CA certificate, and an issuer
  that signs with it, in the release's namespace. */}}
{{- $ca := printf "%s-tls-ca" (include "agentgov.fullname" .) }}
{{- $issuer = dict "name" $ca "kind" "Issuer" "group" "cert-manager.io" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ printf "%s-tls-selfsigned" (include "agentgov.fullname" .) }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $ca }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
spec:
  isCA: true
  commonName: AgentGov internal CA
  secretName: {{ $ca }}
  duration: {{ $cm.duration }}
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef:
    name: {{ printf "%s-tls-selfsigned" (include "agentgov.fullname" .) }}
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $ca }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
spec:
  ca:
    secretName: {{ $ca }}
{{- end }}
{{- /* cert-manager issues each component's certificate into its Secret. */}}
{{- range $parts }}
{{- $name := include "agentgov.name" (list $root .) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "agentgov.tlsSecret" (list $root .) }}
  labels:
    {{- include "agentgov.labels" (list $root .) | nindent 4 }}
spec:
  secretName: {{ include "agentgov.tlsSecret" (list $root .) }}
  commonName: {{ $name }}
  dnsNames:
    - {{ $name }}
    - {{ $name }}.{{ $ns }}
    - {{ $name }}.{{ $ns }}.svc
    - {{ $name }}.{{ $ns }}.svc.cluster.local
  usages: [server auth, client auth]
  duration: {{ $cm.duration }}
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef:
    {{- toYaml $issuer | nindent 4 }}
{{- end }}
{{- else }}
{{- /* AgentGov's own authority, made on install and kept; each component's certificate
  from it, made once and kept too. */}}
{{- $caName := printf "%s-tls-ca" (include "agentgov.fullname" .) }}
{{- $previous := lookup "v1" "Secret" $ns $caName }}
{{- $ca := "" }}
{{- if $previous }}
{{- $ca = buildCustomCert (index $previous.data "tls.crt") (index $previous.data "tls.key") }}
{{- else }}
{{- $ca = genCA "AgentGov internal CA" 3650 }}
{{- end }}
---
# AgentGov's internal certificate authority: it signs the components' certificates.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.Cert | b64enc | quote }}
  tls.key: {{ $ca.Key | b64enc | quote }}
{{- range $parts }}
{{- $secret := include "agentgov.tlsSecret" (list $root .) }}
{{- $name := include "agentgov.name" (list $root .) }}
{{- $kept := (lookup "v1" "Secret" $ns $secret).data | default dict }}
{{- $cert := genSignedCert $name nil (list $name (printf "%s.%s" $name $ns) (printf "%s.%s.svc" $name $ns) (printf "%s.%s.svc.cluster.local" $name $ns)) 3650 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "agentgov.labels" (list $root .) | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ get $kept "tls.crt" | default ($cert.Cert | b64enc) | quote }}
  tls.key: {{ get $kept "tls.key" | default ($cert.Key | b64enc) | quote }}
  ca.crt: {{ get $kept "ca.crt" | default ($ca.Cert | b64enc) | quote }}
{{- end }}
{{- end }}
{{- end }}
