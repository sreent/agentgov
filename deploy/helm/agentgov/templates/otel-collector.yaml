{{- if .Values.otelCollector.enabled }}
{{- $name := include "agentgov.name" (list . "otel-collector") }}
{{- $v := .Values.otelCollector }}
{{- $config := include "agentgov.otelConfig" . }}
# Agents and the gateway send OTLP here. GenAI spans go to the control plane, which
# uses them for discovery (shadow agents), activity and detective controls; so do the
# gateway's access logs of model calls, which meter tokens and cost: on a port of their
# own, which only the gateway may reach (and, with internal TLS, only with a certificate
# from AgentGov's authority).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "otel-collector") | nindent 4 }}
data:
  collector.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      {{- if and .Values.internalTLS.enabled .Values.internalTLS.spire.enabled }}
      initContainers:
        {{- include "agentgov.spireContainer" (list . false) | nindent 8 }}
      {{- end }}
      containers:
        {{- include "agentgov.spireContainer" (list . true) | nindent 8 }}
        - name: otel-collector
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          env:
            - name: AGENTGOV_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentgov.secretName" . }}, key: service-token}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-usage, containerPort: 4319}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 30
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            {{- include "agentgov.tlsMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- include "agentgov.tlsVolume" (list . "otel-collector") | nindent 8 }}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "otel-collector") | nindent 4 }}
spec:
  selector:
    {{- include "agentgov.selector" (list . "otel-collector") | nindent 4 }}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-usage, port: 4319, targetPort: otlp-usage, appProtocol: grpc}
{{- end }}

{{- define "agentgov.otelConfig" -}}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # The gateway's access logs: what they say is billed to agents and counts against their
  # budgets, so they have a receiver of their own, not one agents send traces to.
  otlp/gateway:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        {{- if .Values.internalTLS.enabled }}
        tls:
          cert_file: /tls/tls.crt
          key_file: /tls/tls.key
          client_ca_file: /tls/ca.crt
          reload_interval: 1m
        {{- end }}
processors:
  batch:
    timeout: 2s
  # Only model calls: the gateway logs every request.
  filter/model_calls:
    error_mode: ignore
    logs:
      log_record:
        - attributes["gen_ai.operation.name"] == nil
exporters:
  otlp_http/agentgov:
    endpoint: {{ include "agentgov.internalControlPlaneUrl" . }}/v1/otlp
    encoding: json
    headers:
      Authorization: "Bearer ${env:AGENTGOV_SERVICE_TOKEN}"
    {{- if .Values.internalTLS.enabled }}
    tls:
      ca_file: /tls/ca.crt
      cert_file: /tls/tls.crt
      key_file: /tls/tls.key
      # A renewed certificate is read again (the authority's isn't).
      reload_interval: 1m
    {{- end }}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/agentgov]
    logs:
      receivers: [otlp/gateway]
      processors: [filter/model_calls, batch]
      exporters: [otlp_http/agentgov]
{{- end -}}
