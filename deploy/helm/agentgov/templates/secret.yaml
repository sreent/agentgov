{{- if not .Values.secrets.existingSecret }}
{{- $name := include "agentgov.fullname" . }}
{{- /* Random values on install, then the same ones on every upgrade. */}}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "admin-token" "service-token" "keycloak-client-secret" "oidc-client-secret" "demo-password" "keycloak-admin-password" "postgres-password" }}
  {{ $key }}: {{ get $previous $key | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
{{- end }}
