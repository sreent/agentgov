{{- if not .Values.secrets.existingSecret }}
{{- $name := include "agentgov.fullname" . }}
{{- /* Random values on install, then the same ones on every upgrade. */}}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "admin-token" "service-token" "keycloak-client-secret" "oidc-client-secret" "demo-password" "keycloak-admin-password" "postgres-password" }}
  {{ $key }}: {{ get $previous $key | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.bundleSigning.enabled (not .Values.bundleSigning.existingSecret) }}
{{- $name := include "agentgov.bundleSigningSecret" . }}
{{- /* A key and its certificate on install, then the same ones on every upgrade. */}}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pair := genSelfSignedCert "AgentGov bundles" nil nil 3650 }}
---
# The key the control plane signs OPA's bundles with, and the certificate OPA checks them with.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ get $previous "tls.crt" | default ($pair.Cert | b64enc) | quote }}
  tls.key: {{ get $previous "tls.key" | default ($pair.Key | b64enc) | quote }}
{{- end }}
{{- if and .Values.modelKeys.keys (not .Values.modelKeys.existingSecret) }}
---
# Model providers' API keys given as values (evaluation): the gateway reads each from
# /model-keys/<provider>.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentgov.modelKeysSecret" . }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $provider, $key := .Values.modelKeys.keys }}
  {{ $provider }}: {{ $key | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.destinationSecrets.values (not .Values.destinationSecrets.existingSecret) }}
---
# Destinations' credentials given as values (evaluation): the control plane reads each
# from /destination-secrets/<destination>.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentgov.destinationSecretsSecret" . }}
  labels:
    {{- include "agentgov.labels" (list . "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $destination, $value := .Values.destinationSecrets.values }}
  {{ $destination }}: {{ $value | quote }}
  {{- end }}
{{- end }}
