{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentgov.serviceAccountName" . }}
  labels:
    {{- include "agentgov.labels" (list . "service-account") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of AgentGov's pods calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
