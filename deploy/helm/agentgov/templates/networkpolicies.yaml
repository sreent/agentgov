{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- /*
  Who may reach what. The control plane, the gateway, the collector and Keycloak
  serve people, agents and outside services, so they accept connections from
  anywhere; OPA, the processor, Presidio and PostgreSQL only from AgentGov's own
  parts. Egress is left open: MCP servers, Microsoft's APIs, model providers
  can be anywhere.
*/}}
{{- $parts := splitList " " (include "agentgov.parts" .) }}
{{- $internal := list
  (dict "component" "opa" "ports" (list 8181) "from" (without $parts "opa" "gateway" "otel-collector") "enabled" .Values.opa.enabled)
  (dict "component" "processor" "ports" (list 50051 8091) "from" (list "gateway") "enabled" .Values.gateway.enabled)
  (dict "component" "presidio" "ports" (list 3000) "from" (list "processor") "enabled" (and .Values.presidio.enabled .Values.gateway.enabled))
  (dict "component" "postgresql" "ports" (list 5432) "from" (list "control-plane" "keycloak") "enabled" .Values.postgresql.enabled)
  (dict "component" "control-plane" "ports" (list 8443) "from" (without $parts "control-plane") "enabled" (and .Values.internalTLS.enabled (gt (len $parts) 1)) "suffix" "-internal") }}
{{- range $internal }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentgov.name" (list $root .component) }}{{ .suffix | default "" }}
  labels:
    {{- include "agentgov.labels" (list $root .component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentgov.selector" (list $root .component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range .from }}
        - podSelector:
            matchLabels:
              {{- include "agentgov.selector" (list $root .) | nindent 14 }}
        {{- end }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
{{- $public := list
  (dict "component" "control-plane" "ports" (list 8000) "enabled" true)
  (dict "component" "gateway" "ports" (list 8080) "enabled" .Values.gateway.enabled)
  (dict "component" "otel-collector" "ports" (list 4317 4318 13133) "enabled" .Values.otelCollector.enabled)
  (dict "component" "keycloak" "ports" (list 8080 9000) "enabled" .Values.keycloak.enabled) }}
{{- if and .Values.keycloak.enabled (eq .Values.keycloak.mode "production") }}
---
# Keycloak's replicas talk to each other (JGroups, and its failure detection).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentgov.name" (list $root "keycloak") }}-cluster
  labels:
    {{- include "agentgov.labels" (list $root "keycloak") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentgov.selector" (list $root "keycloak") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentgov.selector" (list $root "keycloak") | nindent 14 }}
      ports:
        - port: 7800
        - port: 57800
{{- end }}
{{- range $public }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentgov.name" (list $root .component) }}
  labels:
    {{- include "agentgov.labels" (list $root .component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentgov.selector" (list $root .component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        {{- range .ports }}
        - port: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
