{{- $name := include "agentgov.name" (list . "gateway") }}
{{- $v := .Values.gateway }}
{{- $sync := dict "image" (include "agentgov.image" .) "pullPolicy" .Values.image.pullPolicy }}
# The MCP gateway (agentgateway). Its configuration is generated by the control
# plane from the registry; `agentgov gateway-config` keeps a copy current beside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "gateway") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        # The first configuration, before the gateway starts.
        - name: config
          image: {{ $sync.image }}
          imagePullPolicy: {{ $sync.pullPolicy }}
          args: ["gateway-config", "--output", "/gateway/config.yaml", "--once"]
          env:
            {{- include "agentgov.gatewayConfigEnv" . | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: gateway-config, mountPath: /gateway}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: agentgateway
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: ["-f", "/gateway/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            # A route of the generated configuration.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: gateway-config, mountPath: /gateway, readOnly: true}
        # Rewrites the file when tool servers change; agentgateway reloads it.
        - name: config-sync
          image: {{ $sync.image }}
          imagePullPolicy: {{ $sync.pullPolicy }}
          args: ["gateway-config", "--output", "/gateway/config.yaml", "--interval", {{ $v.configInterval | quote }}]
          env:
            {{- include "agentgov.gatewayConfigEnv" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: gateway-config, mountPath: /gateway}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: gateway-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "gateway") | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "agentgov.selector" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http

{{- define "agentgov.gatewayConfigEnv" -}}
- name: AGENTGOV_CONTROL_PLANE_URL
  value: {{ include "agentgov.controlPlaneUrl" . | quote }}
- name: AGENTGOV_SERVICE_TOKEN
  valueFrom:
    secretKeyRef: {name: {{ include "agentgov.secretName" . }}, key: service-token}
{{- end -}}
