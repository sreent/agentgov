{{- $name := include "agentgov.name" (list . "gateway") }}
{{- $v := .Values.gateway }}
{{- $sync := dict "image" (include "agentgov.image" .) "pullPolicy" .Values.image.pullPolicy }}
# The gateway (agentgateway) for tool calls and model calls. Its configuration is
# generated by the control plane from the registry; `agentgov gateway-config` keeps a
# copy current beside it, checking first that each model provider's key is there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "gateway") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        {{- include "agentgov.spireContainer" (list . false) | nindent 8 }}
        # The first configuration, before the gateway starts.
        - name: config
          image: {{ $sync.image }}
          imagePullPolicy: {{ $sync.pullPolicy }}
          args: ["gateway-config", "--output", "/gateway/config.yaml", "--once"]
          env:
            {{- include "agentgov.gatewayConfigEnv" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: gateway-config, mountPath: /gateway}
            - {name: tmp, mountPath: /tmp}
            - {name: model-keys, mountPath: /model-keys, readOnly: true}
            {{- include "agentgov.tlsMount" . | nindent 12 }}
      containers:
        - name: agentgateway
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: ["-f", "/gateway/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            # A route of the generated configuration.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: gateway-config, mountPath: /gateway, readOnly: true}
            - {name: model-keys, mountPath: /model-keys, readOnly: true}
            # Its certificate for the processor (mutual TLS).
            {{- include "agentgov.tlsMount" . | nindent 12 }}
        {{- include "agentgov.spireContainer" (list . true) | nindent 8 }}
        # Rewrites the file when tool servers change, or its certificate is renewed;
        # agentgateway reloads it.
        - name: config-sync
          image: {{ $sync.image }}
          imagePullPolicy: {{ $sync.pullPolicy }}
          args: ["gateway-config", "--output", "/gateway/config.yaml", "--interval", {{ $v.configInterval | quote }},
                 "--heartbeat", "/tmp/gateway-config.alive"]
          env:
            {{- include "agentgov.gatewayConfigEnv" . | nindent 12 }}
          # Ready while the file agentgateway reads is there, whether or not the control
          # plane answers; alive while the loop keeps touching its heartbeat.
          readinessProbe:
            exec: {command: ["test", "-s", "/gateway/config.yaml"]}
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/gateway-config.alive) )) -lt {{ max 60 (mul 6 $v.configInterval) }}"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: gateway-config, mountPath: /gateway}
            - {name: tmp, mountPath: /tmp}
            - {name: model-keys, mountPath: /model-keys, readOnly: true}
            {{- include "agentgov.tlsMount" . | nindent 12 }}
      volumes:
        - name: gateway-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Model providers' API keys, one per provider name. Optional: without the
        # Secret, providers answer 503 until their key is there.
        - name: model-keys
          secret:
            secretName: {{ include "agentgov.modelKeysSecret" . }}
            optional: true
        {{- include "agentgov.tlsVolume" (list . "gateway") | nindent 8 }}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "gateway") | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "agentgov.selector" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http

{{- define "agentgov.gatewayConfigEnv" -}}
- name: AGENTGOV_CONTROL_PLANE_URL
  value: {{ include "agentgov.internalControlPlaneUrl" . | quote }}
{{- if .Values.internalTLS.enabled }}
- name: AGENTGOV_TLS_DIR
  value: /tls
- name: AGENTGOV_TLS_RELOAD_SECONDS
  value: {{ .Values.internalTLS.reloadSeconds | quote }}
{{- end }}
- name: AGENTGOV_SERVICE_TOKEN
  valueFrom:
    secretKeyRef: {name: {{ include "agentgov.secretName" . }}, key: service-token}
{{- end -}}
