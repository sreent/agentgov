{{- $name := include "agentgov.name" (list . "opa") }}
{{- $v := .Values.opa }}
{{- $config := include "agentgov.opaConfig" . }}
# The policy decision point. It long-polls the control plane for the Rego library,
# organisation policies and registry data, and reports decisions and status back.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "opa") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "opa") | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: opa
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --config-file=/config/config.yaml
            - --log-level=info
            # Each instance reports its status under its own name.
            - --set=labels.id=$(POD_NAME)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: AGENTGOV_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentgov.secretName" . }}, key: service-token}
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            # Ready once it has activated the bundle from the control plane.
            httpGet: {path: "/health?bundles", port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
spec:
  selector:
    {{- include "agentgov.selector" (list . "opa") | nindent 4 }}
  ports:
    - name: http
      port: 8181
      targetPort: http

{{- define "agentgov.opaConfig" -}}
services:
  controlplane:
    url: {{ include "agentgov.controlPlaneUrl" . }}/v1/opa
    credentials:
      bearer:
        token: "${AGENTGOV_SERVICE_TOKEN}"
bundles:
  agentgov:
    service: controlplane
    resource: bundles/agentgov.tar.gz
    polling:
      min_delay_seconds: 5
      max_delay_seconds: 15
      long_polling_timeout_seconds: 30
decision_logs:
  service: controlplane
  reporting:
    min_delay_seconds: 2
    max_delay_seconds: 10
status:
  service: controlplane
{{- end -}}
