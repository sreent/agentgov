{{- $name := include "agentgov.name" (list . "opa") }}
{{- $v := .Values.opa }}
{{- $config := include "agentgov.opaConfig" . }}
# The policy decision point. It long-polls the control plane for the Rego library,
# organisation policies and registry data, and reports decisions and status back.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "agentgov.selector" (list . "opa") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgov.labels" (list . "opa") | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "agentgov.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables for each Service: AGENTGOV_GATEWAY_PORT is a setting.
      enableServiceLinks: false
      securityContext:
        {{- include "agentgov.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      {{- if and .Values.internalTLS.enabled .Values.internalTLS.spire.enabled }}
      initContainers:
        {{- include "agentgov.spireContainer" (list . false) | nindent 8 }}
      {{- end }}
      containers:
        {{- include "agentgov.spireContainer" (list . true) | nindent 8 }}
        - name: opa
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --config-file=/config/config.yaml
            - --log-level=info
            # Each instance reports its status under its own name.
            - --set=labels.id=$(POD_NAME)
            {{- if .Values.bundleSigning.enabled }}
            # The certificate the control plane's signatures are checked with.
            - --set-file=keys.agentgov.key=/bundle-signing/cert.pem
            {{- end }}
            {{- if .Values.internalTLS.enabled }}
            # Over mutual TLS: callers show a certificate from AgentGov's authority.
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --tls-ca-cert-file=/tls/ca.crt
            - --authentication=tls
            # A renewed certificate (cert-manager's, SPIRE's) takes effect within a minute.
            - --tls-cert-refresh-period=1m
            {{- if .Values.internalTLS.spire.enabled }}
            # SPIRE gives every workload a certificate: only the processor and the control
            # plane, by their SPIFFE IDs (system.authz).
            - --authorization=basic
            - /authz/authz.rego
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: AGENTGOV_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentgov.secretName" . }}, key: service-token}
          ports:
            - name: http
              containerPort: 8181
          {{- if .Values.internalTLS.enabled }}
          # Its every port asks for a client certificate, which probes don't have; the
          # processor refuses calls until OPA has a bundle.
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          {{- else }}
          readinessProbe:
            # Ready once it has activated the bundle from the control plane.
            httpGet: {path: "/health?bundles", port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "agentgov.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.bundleSigning.enabled }}
            - name: bundle-signing
              mountPath: /bundle-signing
              readOnly: true
            {{- end }}
            {{- include "agentgov.tlsMount" . | nindent 12 }}
            {{- if and .Values.internalTLS.enabled .Values.internalTLS.spire.enabled }}
            - {name: authz, mountPath: /authz, readOnly: true}
            {{- end }}
      volumes:
        {{- include "agentgov.tlsVolume" (list . "opa") | nindent 8 }}
        {{- if and .Values.internalTLS.enabled .Values.internalTLS.spire.enabled }}
        - name: authz
          configMap:
            name: {{ printf "%s-opa-authz" (include "agentgov.fullname" .) }}
        {{- end }}
        {{- if .Values.bundleSigning.enabled }}
        # Only the certificate, out of the bundle-signing Secret.
        - name: bundle-signing
          secret:
            secretName: {{ include "agentgov.bundleSigningSecret" . }}
            items: [{key: tls.crt, path: cert.pem}]
        {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
      {{- include "agentgov.scheduling" $v | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentgov.labels" (list . "opa") | nindent 4 }}
spec:
  selector:
    {{- include "agentgov.selector" (list . "opa") | nindent 4 }}
  ports:
    - name: http
      port: 8181
      targetPort: http

{{- define "agentgov.opaConfig" -}}
services:
  controlplane:
    url: {{ include "agentgov.internalControlPlaneUrl" . }}/v1/opa
    {{- if .Values.internalTLS.enabled }}
    # The control plane's internal port: OPA shows its certificate, and checks the
    # control plane's.
    tls:
      ca_cert: /tls/ca.crt
    credentials:
      client_tls:
        cert: /tls/tls.crt
        private_key: /tls/tls.key
    {{- else }}
    credentials:
      bearer:
        token: "${AGENTGOV_SERVICE_TOKEN}"
    {{- end }}
bundles:
  agentgov:
    service: controlplane
    resource: bundles/agentgov.tar.gz
    polling:
      min_delay_seconds: 5
      max_delay_seconds: 15
      long_polling_timeout_seconds: 30
    {{- if .Values.bundleSigning.enabled }}
    # OPA refuses a bundle that doesn't verify, and keeps the last good one.
    signing:
      keyid: agentgov
    {{- end }}
{{- if .Values.bundleSigning.enabled }}
keys:
  agentgov:
    algorithm: {{ .Values.bundleSigning.algorithm }}
{{- end }}
decision_logs:
  service: controlplane
  reporting:
    min_delay_seconds: 2
    max_delay_seconds: 10
status:
  service: controlplane
{{- end -}}
