# AgentGov on Kubernetes. The defaults install a complete stack, PostgreSQL and
# Keycloak included, to evaluate it. For production, use a managed PostgreSQL
# (postgresql.enabled=false), run Keycloak in production mode or bring your own, put
# HTTPS in front (ingress or httpRoute) and turn on the network policies: see
# docs/deploy/kubernetes.md, and the cloud guides beside it.
#
# To run less of it, start from a profile (docs/deploy/kubernetes.md#profiles):
#   -f profiles/inventory.yaml  the agents on your platforms, their findings and issues;
#                               no gateway, OPA, Presidio or Keycloak
#   -f profiles/monitor.yaml    the gateway, with every control watching rather than
#                               stopping, and no Presidio

image:
  # The AgentGov image: the control plane, the governance processor and the gateway's
  # configuration sidecar.
  repository: ghcr.io/sreent/agentgov
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Addresses people, agents and outside services use. They end up in sign-in
# redirects, token issuers and what the API reports, so set them to what users
# actually type (https:// with TLS).
urls:
  # The control plane: admin UI, API, single sign-on callback (AGENTGOV_PUBLIC_URL).
  controlPlane: http://localhost:8000
  # The MCP gateway agents connect to.
  gateway: http://localhost:8080
  # The bundled Keycloak, as browsers and agents reach it. Tokens name it as issuer.
  keycloak: http://localhost:8180

# Features the deployment pins (docs/features.md), for example
#   features: {least-privilege: monitor, discovery: "off"}
# Administrators see them in the app but can't change them there; they choose the
# modes of the other features themselves.
features: {}
# A starting point for the features' modes, applied once (docs/features.md#starting-points):
# "monitor" (every control records what it would do and stops nothing) or "inventory" (no
# gateway). Empty: each feature's default.
featurePreset: ""
# When a call through the gateway can't be checked, because OPA can't decide or the
# governance processor can't be reached (docs/features.md#when-something-is-down): "modes"
# refuses it only while a control at the gateway is enforced, "closed" always, "open" never.
gatewayFailureMode: modes

# The Keycloak clients of the apps people use agents from, which hand people's tokens
# to the agents that act for them (docs/acting-for-people.md). AgentGov offers these
# apps each such agent's client scope. With keycloak.demoUsers, the demo app
# agentgov-demo-chat is one of them.
peopleApps: []

# Model providers' API keys (docs/models.md). The gateway reads each from
# /model-keys/<provider>, so the keys never enter AgentGov. Name a Secret you manage,
# whose keys are provider names, or, to evaluate, give the keys here and the chart
# creates the Secret: keys: {openai: sk-...}.
modelKeys:
  existingSecret: ""
  keys: {}

# Destinations' credentials (docs/secops.md): Teams and Slack webhook URLs, Splunk's HTTP
# Event Collector token, and headers for OpenTelemetry and webhook destinations. The
# control plane reads each from /destination-secrets/<destination> when it sends, so they
# never enter AgentGov's database. Name a Secret you manage, whose keys are destination
# names, or, to evaluate, give them here and the chart creates the Secret:
# values: {soc-slack: https://hooks.slack.com/services/...}.
destinationSecrets:
  existingSecret: ""
  values: {}

secrets:
  # A Secret you manage, with the keys admin-token, service-token,
  # keycloak-client-secret and oidc-client-secret; keycloak-admin-password with the
  # bundled Keycloak, demo-password with its demo users, and postgres-password with the
  # bundled PostgreSQL. Without one, the chart creates the Secret with random values and
  # keeps them across upgrades.
  existingSecret: ""

controlPlane:
  # Two or more for high availability, on PostgreSQL (the bundled one or yours): the
  # replicas hear each other's changes through it, and one at a time runs the scheduled
  # work (docs/architecture.md, "Scaling notes").
  replicas: 1
  # Apply database migrations when it starts. Several replicas starting together
  # migrate one at a time.
  autoMigrate: true
  # More settings, as AGENTGOV_* environment variables (docs/configuration.md), for
  # example AGENTGOV_AUTO_BLOCK_RISK_SCORE or AGENTGOV_M365_TENANT_ID.
  env: {}
  # Secrets or ConfigMaps to read settings from, for example one holding
  # AGENTGOV_M365_CLIENT_SECRET: [{secretRef: {name: agentgov-microsoft}}].
  envFrom: []
  # More volumes, and where the control plane mounts them: for example the certificate
  # of your database's certificate authority, for sslrootcert in the database URL.
  extraVolumes: []
  extraVolumeMounts: []
  # Keep the ledger's entries in the database for retentionDays, then archive them to a
  # volume (docs/evidence.md). Off, every entry stays in the database. The archives are
  # evidence: back the volume up, or copy them to storage that can't be rewritten.
  ledgerArchive:
    enabled: false
    # At least 183 days (six months).
    retentionDays: 365
    # A PersistentVolumeClaim you manage; without one, the chart makes one.
    existingClaim: ""
    size: 20Gi
    storageClass: ""
    # Several replicas need ReadWriteMany (a file share such as Azure Files, Filestore or
    # EFS): any of them may archive.
    accessMode: ReadWriteOnce
  # Put the ledger's checkpoints in a transparency log too (docs/evidence.md): Sigstore's
  # public Rekor, such as https://log2025-1.rekor.sigstore.dev, or a rekor-tiles of yours.
  # AgentGov signs each checkpoint with its key, from a Secret (key.pem, ECDSA P-256:
  # `agentgov transparency-key DIR` makes one), and checks the log's answers with the
  # log's public key. Empty url: no log.
  transparencyLog:
    url: ""
    # The Secret holding AgentGov's key, as key.pem.
    signingKeySecret: ""
    # The log's public key (PEM, Ed25519), for example with --set-file. Empty, the log's
    # answers are kept unchecked.
    logKey: ""
    # The log's name in its checkpoints; empty: the URL's host name.
    origin: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Defaults to the host of urls.controlPlane.
    host: ""
    tls: []
  # Or a Gateway API HTTPRoute, attached to a Gateway you manage.
  httpRoute:
    enabled: false
    # The Gateway, and its listener, for example [{name: agentgov, sectionName: https}].
    parentRefs: []
    annotations: {}
    # Defaults to the host of urls.controlPlane.
    host: ""
    # The route's timeouts, where the Gateway's implementation supports them.
    timeouts: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

processor:
  replicas: 1
  # More settings for the governance processor, as AGENTGOV_* environment variables
  # (docs/configuration.md), for example AGENTGOV_PII_ENTITIES, or what it does when
  # Presidio, Granite Guardian or your decision point is down
  # (AGENTGOV_PRESIDIO_FAILURE_MODE, AGENTGOV_GUARDIAN_FAILURE_MODE,
  # AGENTGOV_AUTHZEN_FAILURE_MODE); and Secrets or ConfigMaps to read them from.
  env: {}
  envFrom: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  # The gateway and the governance processor that checks its calls: what AgentGov
  # enforces on agents' tool, model and agent-to-agent calls. Off, AgentGov keeps the
  # inventory, its findings and issues, and needs no OPA, Presidio or Keycloak; turn
  # the gateway's features off too (featurePreset: inventory).
  enabled: true
  image:
    repository: ghcr.io/agentgateway/agentgateway
    tag: v1.6.0
    pullPolicy: IfNotPresent
  replicas: 1
  # Seconds between checks for configuration changes (new or changed tool servers).
  configInterval: 5
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 512Mi}
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Defaults to the host of urls.gateway.
    host: ""
    tls: []
  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    # Defaults to the host of urls.gateway.
    host: ""
    # Agents' streams stay open for as long as they last: where the default request
    # timeout of the Gateway's implementation is short, turn it off ({request: "0s"}).
    timeouts: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

opa:
  # The policy engine: the gateway's processor asks it about every call, and the control
  # plane about Copilot Studio's tool calls and AuthZEN's questions. The gateway needs it.
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: 1.21.1-static
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

presidio:
  # Personal-data detection, for the gateway's processor (so it runs with the gateway).
  # Without it, the processor checks for secrets, prompt injection and poisoned tools, but
  # not personal data.
  enabled: true
  image:
    repository: ghcr.io/data-privacy-stack/presidio-analyzer
    tag: "2.2.364@sha256:ae8f6f111ac2f04e3fec552f7f80edd0dcbfa2dd69ee1b9e030475be31669885"
    pullPolicy: IfNotPresent
  replicas: 1
  # Its language models take about 1.5 GiB once loaded.
  resources:
    requests: {cpu: 100m, memory: 1536Mi}
    limits: {memory: 2560Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

otelCollector:
  # Receives agents' and the gateway's traces (OTLP :4317 gRPC, :4318 HTTP) for
  # discovery and activity.
  enabled: true
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.162.0
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  # A single PostgreSQL for AgentGov (and the bundled Keycloak), for evaluation.
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Your own PostgreSQL, with postgresql.enabled=false: a Secret holding the URL,
# postgresql+psycopg://USER:PASSWORD@HOST:5432/DATABASE.
externalDatabase:
  existingSecret: ""
  key: database-url

keycloak:
  # Keycloak, with AgentGov's realm imported on its first start. It keeps its data in
  # the bundled PostgreSQL, or in keycloak.externalDatabase. The gateway needs it, or
  # your own (externalKeycloak): it checks agents' tokens. Without the gateway, neither is
  # needed: administrators sign in with your identity provider (controlPlane.env
  # AGENTGOV_OIDC_ISSUER) or an API token.
  enabled: true
  # dev: development mode (kc.sh start-dev), for evaluation. production: production mode
  # (kc.sh start), behind a load balancer that terminates TLS (keycloak.ingress), at
  # urls.keycloak.
  mode: dev
  # In production mode. Start with one, and add more once the realm is imported.
  replicas: 1
  # Its database when postgresql.enabled=false: the JDBC URL, for example
  # jdbc:postgresql://HOST:5432/keycloak?sslmode=verify-full&sslrootcert=..., the user,
  # and the Secret (and key) with the user's password.
  externalDatabase:
    url: ""
    username: keycloak
    existingSecret: ""
    passwordKey: keycloak-database-password
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.8.0
    pullPolicy: IfNotPresent
  # Import the demo users admin, alice, sofia, audrey and sam (password: demo-password in the
  # Secret), and the demo app agentgov-demo-chat, where people sign in with their
  # password. Turn off before anyone else can reach Keycloak.
  demoUsers: true
  # Keycloak features to turn on (KC_FEATURES): SPIFFE identity issuers need the spiffe
  # preview feature.
  features: [spiffe]
  # Mount Keycloak's service account token, so that it can read the keys of a cluster
  # issuer that only the cluster's API server publishes, such as kind's and kubeadm's
  # https://kubernetes.default.svc.cluster.local. GKE, AKS and EKS publish their issuers'
  # keys on the internet and need nothing here (docs/agent-identity.md).
  mountServiceAccountToken: false
  # More volumes, and where Keycloak mounts them: for example the certificate of your
  # database's certificate authority, for sslrootcert in the JDBC URL.
  extraVolumes: []
  extraVolumeMounts: []
  # About 700 MiB in use with AgentGov's realm.
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1536Mi}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Defaults to the host of urls.keycloak.
    host: ""
    tls: []
  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    # Defaults to the host of urls.keycloak.
    host: ""
    timeouts: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Your own Keycloak, with keycloak.enabled=false. Import files/agentgov-realm.json
# into it first (or create the agentgov-control-plane and agentgov-admin clients by
# hand) and put both clients' secrets in the Secret.
externalKeycloak:
  # Where the control plane and the gateway reach Keycloak, for example
  # https://keycloak.example.com.
  url: ""
  realm: agentgov
  # The issuer in its tokens; defaults to url + /realms/ + realm.
  issuer: ""

internalTLS:
  # Mutual TLS between AgentGov's components (docs/production.md): each has a
  # certificate from AgentGov's own authority, serves TLS on its internal ports and asks
  # callers for a certificate from the same authority; the control plane gives the
  # service role only on its internal port (8443). The chart makes the authority and the
  # certificates on install and keeps them; or let cert-manager or SPIRE issue them.
  enabled: true
  certManager:
    # Certificates from cert-manager instead. The control plane and OPA take any
    # certificate from the authority as one of AgentGov's components, so the authority
    # must issue AgentGov's certificates only. Without an issuer named here, cert-manager
    # makes one for this release alone (a self-signed CA in its namespace, kept in the
    # <release>-tls-ca Secret). An issuer of yours must be an Issuer in the release's
    # namespace whose CA issues nothing else; a ClusterIssuer issues to any namespace
    # that asks, so the chart refuses one.
    enabled: false
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    # How long the components' certificates last. Each component takes a renewed one
    # without a restart (reloadSeconds below; OPA every minute).
    duration: 87600h
  # Seconds between each component's looks at its certificate files: a renewed
  # certificate (cert-manager's, or SPIRE's) serves the next connections, with no restart.
  # 0 reads them at start only.
  reloadSeconds: 60
  spire:
    # Certificates from SPIFFE / SPIRE instead (X.509-SVIDs, docs/production.md): each
    # component's pod gets its SVID from the SPIRE agent through the SPIFFE CSI driver, and
    # spiffe-helper keeps it in the files the component reads, as SPIRE renews it. SPIRE
    # gives every workload an SVID, so each component takes only the callers among
    # AgentGov's components that call it, by their SPIFFE IDs
    # (spiffe://<trustDomain>/ns/<namespace>/agentgov/<component's name>). Needs SPIRE
    # with its CSI driver and controller manager (the spire-crds and spire charts). A pod
    # with a component's labels in the release's namespace gets its identity: keep the
    # namespace to AgentGov.
    enabled: false
    # SPIRE's trust domain.
    trustDomain: example.org
    # The class of SPIRE's controller manager, which is <SPIRE's namespace>-<SPIRE's
    # release> unless SPIRE's chart sets another: spire-mgmt-spire for SPIRE's production
    # install, spire-server-spire for its quick install.
    className: spire-mgmt-spire
    # The SPIFFE CSI driver.
    csiDriver: csi.spiffe.io
    # How long the SVIDs last, such as 4h (empty: SPIRE's default).
    ttl: ""
    helper:
      image: ghcr.io/spiffe/spiffe-helper:0.12.2
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {memory: 64Mi}

guardian:
  # IBM Granite Guardian, for a second opinion on agents' instructions and on their
  # traffic (docs/detection.md): its OpenAI-compatible API's base URL, such as
  # http://guardian:8000/v1. The control plane and the governance processor both ask it.
  # Empty, AgentGov's rules decide alone.
  url: ""
  model: ibm-granite/granite-guardian-4.1-8b
  # A Secret holding the API's key, if it needs one (key: api-key).
  existingSecret: ""

bundleSigning:
  # The control plane signs OPA's bundles, and OPA refuses one that doesn't verify, so
  # that nobody on the way between them can hand OPA policies or data of their own
  # (docs/architecture.md). The chart makes the key (RSA) and its certificate on install
  # and keeps them; or name a kubernetes.io/tls Secret of yours (tls.key and tls.crt),
  # such as one cert-manager issues.
  enabled: true
  existingSecret: ""
  # RS256 for an RSA key; ES256 or ES384 for an EC key on P-256 or P-384.
  algorithm: RS256

podDisruptionBudget:
  # For each part running two or more replicas, a PodDisruptionBudget that lets a node
  # drain take one replica at a time.
  enabled: true

networkPolicy:
  # Allow only the traffic AgentGov needs between its parts (your CNI must enforce
  # NetworkPolicy). The control plane, gateway and collector stay reachable from
  # anywhere; OPA, the processor, Presidio and the databases only from AgentGov.
  enabled: false

serviceAccount:
  # One service account for AgentGov's pods; none of them calls the Kubernetes API.
  create: true
  name: ""
  annotations: {}
