# AgentGov on Kubernetes. The defaults install a complete stack, PostgreSQL and
# Keycloak included, to evaluate it. For production, use a managed PostgreSQL
# (postgresql.enabled=false), run Keycloak in production mode or bring your own, put
# HTTPS in front (ingress or httpRoute) and turn on the network policies: see
# docs/deploy/kubernetes.md, and the cloud guides beside it.

image:
  # The AgentGov image: the control plane, the governance processor and the gateway's
  # configuration sidecar.
  repository: ghcr.io/sreent/agentgov
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Addresses people, agents and outside services use. They end up in sign-in
# redirects, token issuers and what the API reports, so set them to what users
# actually type (https:// with TLS).
urls:
  # The control plane: admin UI, API, single sign-on callback (AGENTGOV_PUBLIC_URL).
  controlPlane: http://localhost:8000
  # The MCP gateway agents connect to.
  gateway: http://localhost:8080
  # The bundled Keycloak, as browsers and agents reach it. Tokens name it as issuer.
  keycloak: http://localhost:8180

# Features the deployment pins (docs/features.md), for example
#   features: {least-privilege: monitor, discovery: "off"}
# Administrators see them in the app but can't change them there; they choose the
# modes of the other features themselves.
features: {}

# The Keycloak clients of the apps people use agents from, which hand people's tokens
# to the agents that act for them (docs/acting-for-people.md). AgentGov offers these
# apps each such agent's client scope. With keycloak.demoUsers, the demo app
# agentgov-demo-chat is one of them.
peopleApps: []

# Model providers' API keys (docs/models.md). The gateway reads each from
# /model-keys/<provider>, so the keys never enter AgentGov. Name a Secret you manage,
# whose keys are provider names, or, to evaluate, give the keys here and the chart
# creates the Secret: keys: {openai: sk-...}.
modelKeys:
  existingSecret: ""
  keys: {}

# Destinations' credentials (docs/secops.md): Teams and Slack webhook URLs, Splunk's HTTP
# Event Collector token, and headers for OpenTelemetry and webhook destinations. The
# control plane reads each from /destination-secrets/<destination> when it sends, so they
# never enter AgentGov's database. Name a Secret you manage, whose keys are destination
# names, or, to evaluate, give them here and the chart creates the Secret:
# values: {soc-slack: https://hooks.slack.com/services/...}.
destinationSecrets:
  existingSecret: ""
  values: {}

secrets:
  # A Secret you manage, with the keys admin-token, service-token,
  # keycloak-client-secret and oidc-client-secret; keycloak-admin-password with the
  # bundled Keycloak, demo-password with its demo users, and postgres-password with the
  # bundled PostgreSQL. Without one, the chart creates the Secret with random values and
  # keeps them across upgrades.
  existingSecret: ""

controlPlane:
  # Keep one: signed-in admins' Microsoft sign-ins and change notifications live in
  # its memory (docs/architecture.md, "Scaling notes").
  replicas: 1
  # Apply database migrations when it starts. Several replicas starting together
  # migrate one at a time.
  autoMigrate: true
  # More settings, as AGENTGOV_* environment variables (docs/configuration.md), for
  # example AGENTGOV_AUTO_BLOCK_RISK_SCORE or AGENTGOV_M365_TENANT_ID.
  env: {}
  # Secrets or ConfigMaps to read settings from, for example one holding
  # AGENTGOV_M365_CLIENT_SECRET: [{secretRef: {name: agentgov-microsoft}}].
  envFrom: []
  # More volumes, and where the control plane mounts them: for example the certificate
  # of your database's certificate authority, for sslrootcert in the database URL.
  extraVolumes: []
  extraVolumeMounts: []
  # Keep the ledger's entries in the database for retentionDays, then archive them to a
  # volume (docs/evidence.md). Off, every entry stays in the database. The archives are
  # evidence: back the volume up, or copy them to storage that can't be rewritten.
  ledgerArchive:
    enabled: false
    # At least 183 days (six months).
    retentionDays: 365
    # A PersistentVolumeClaim you manage; without one, the chart makes one.
    existingClaim: ""
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Defaults to the host of urls.controlPlane.
    host: ""
    tls: []
  # Or a Gateway API HTTPRoute, attached to a Gateway you manage.
  httpRoute:
    enabled: false
    # The Gateway, and its listener, for example [{name: agentgov, sectionName: https}].
    parentRefs: []
    annotations: {}
    # Defaults to the host of urls.controlPlane.
    host: ""
    # The route's timeouts, where the Gateway's implementation supports them.
    timeouts: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

processor:
  replicas: 1
  # More settings for the governance processor, as AGENTGOV_* environment variables
  # (docs/configuration.md), for example AGENTGOV_PII_ENTITIES or
  # AGENTGOV_PRESIDIO_FAILURE_MODE; and Secrets or ConfigMaps to read them from.
  env: {}
  envFrom: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  image:
    repository: ghcr.io/agentgateway/agentgateway
    tag: v1.6.0
    pullPolicy: IfNotPresent
  replicas: 1
  # Seconds between checks for configuration changes (new or changed tool servers).
  configInterval: 5
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 512Mi}
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Defaults to the host of urls.gateway.
    host: ""
    tls: []
  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    # Defaults to the host of urls.gateway.
    host: ""
    # Agents' streams stay open for as long as they last: where the default request
    # timeout of the Gateway's implementation is short, turn it off ({request: "0s"}).
    timeouts: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

opa:
  image:
    repository: openpolicyagent/opa
    tag: 1.21.1-static
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

presidio:
  # Personal-data detection. Without it, the processor checks for secrets, prompt
  # injection and poisoned tools, but not personal data.
  enabled: true
  image:
    repository: ghcr.io/data-privacy-stack/presidio-analyzer
    tag: "2.2.364@sha256:ae8f6f111ac2f04e3fec552f7f80edd0dcbfa2dd69ee1b9e030475be31669885"
    pullPolicy: IfNotPresent
  replicas: 1
  # Its language models take about 1.5 GiB once loaded.
  resources:
    requests: {cpu: 100m, memory: 1536Mi}
    limits: {memory: 2560Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

otelCollector:
  # Receives agents' and the gateway's traces (OTLP :4317 gRPC, :4318 HTTP) for
  # discovery and activity.
  enabled: true
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: 0.162.0
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  # A single PostgreSQL for AgentGov (and the bundled Keycloak), for evaluation.
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Your own PostgreSQL, with postgresql.enabled=false: a Secret holding the URL,
# postgresql+psycopg://USER:PASSWORD@HOST:5432/DATABASE.
externalDatabase:
  existingSecret: ""
  key: database-url

keycloak:
  # Keycloak, with AgentGov's realm imported on its first start. It keeps its data in
  # the bundled PostgreSQL, or in keycloak.externalDatabase.
  enabled: true
  # dev: development mode (kc.sh start-dev), for evaluation. production: production mode
  # (kc.sh start), behind a load balancer that terminates TLS (keycloak.ingress), at
  # urls.keycloak.
  mode: dev
  # In production mode. Start with one, and add more once the realm is imported.
  replicas: 1
  # Its database when postgresql.enabled=false: the JDBC URL, for example
  # jdbc:postgresql://HOST:5432/keycloak?sslmode=verify-full&sslrootcert=..., the user,
  # and the Secret (and key) with the user's password.
  externalDatabase:
    url: ""
    username: keycloak
    existingSecret: ""
    passwordKey: keycloak-database-password
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.8.0
    pullPolicy: IfNotPresent
  # Import the demo users admin, alice, sofia, audrey and sam (password: demo-password in the
  # Secret), and the demo app agentgov-demo-chat, where people sign in with their
  # password. Turn off before anyone else can reach Keycloak.
  demoUsers: true
  # Keycloak features to turn on (KC_FEATURES): SPIFFE identity issuers need the spiffe
  # preview feature.
  features: [spiffe]
  # Mount Keycloak's service account token, so that it can read the keys of a cluster
  # issuer that only the cluster's API server publishes, such as kind's and kubeadm's
  # https://kubernetes.default.svc.cluster.local. GKE, AKS and EKS publish their issuers'
  # keys on the internet and need nothing here (docs/agent-identity.md).
  mountServiceAccountToken: false
  # More volumes, and where Keycloak mounts them: for example the certificate of your
  # database's certificate authority, for sslrootcert in the JDBC URL.
  extraVolumes: []
  extraVolumeMounts: []
  # About 700 MiB in use with AgentGov's realm.
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1536Mi}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Defaults to the host of urls.keycloak.
    host: ""
    tls: []
  httpRoute:
    enabled: false
    parentRefs: []
    annotations: {}
    # Defaults to the host of urls.keycloak.
    host: ""
    timeouts: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Your own Keycloak, with keycloak.enabled=false. Import files/agentgov-realm.json
# into it first (or create the agentgov-control-plane and agentgov-admin clients by
# hand) and put both clients' secrets in the Secret.
externalKeycloak:
  # Where the control plane and the gateway reach Keycloak, for example
  # https://keycloak.example.com.
  url: ""
  realm: agentgov
  # The issuer in its tokens; defaults to url + /realms/ + realm.
  issuer: ""

networkPolicy:
  # Allow only the traffic AgentGov needs between its parts (your CNI must enforce
  # NetworkPolicy). The control plane, gateway and collector stay reachable from
  # anywhere; OPA, the processor, Presidio and the databases only from AgentGov.
  enabled: false

serviceAccount:
  # One service account for AgentGov's pods; none of them calls the Kubernetes API.
  create: true
  name: ""
  annotations: {}
