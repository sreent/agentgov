# Blueprints are IT-approved templates: what a class of agents may do, how
# risky it is, and how often sponsors must re-attest that each agent is needed.
apiVersion: agentgov/v1alpha1
kind: Blueprint
metadata:
  name: customer-support
spec:
  description: Tier-1 support agents that look up and annotate customer records.
  risk_tier: medium
  require_sponsor: true
  attestation_days: 90
  permissions:
    - server: crm
      tools:
        - search_customers
        - get_customer
        - get_customer_notes
        - add_note
        - delete_customer   # destructive: the baseline policy routes it to a human
  # Models agents of this blueprint may call through the gateway (globs), and the
  # tokens each may use per UTC day.
  model_access:
    - provider: demo
      models: [mock-small]
  daily_token_budget: 20000
  # Whom its agents act for (docs/acting-for-people.md): people, itself or either; the
  # groups those people must be in (empty: anyone); and who decides the approval
  # requests its agents make for a person: approvers or person.
  acts_for: either
  people_groups: []
  approvals_by: approvers
  # Other agents its agents may hand work to over A2A, through the gateway
  # (docs/agent-to-agent.md): names, or patterns such as billing-*.
  agent_access: [billing-agent]
  # The team that issues about its agents go to after their owners and sponsors
  # (docs/issues.md, and teams.yaml).
  team: cx-platform
---
apiVersion: agentgov/v1alpha1
kind: Blueprint
metadata:
  name: analytics
spec:
  description: Reporting agents with read-only access and entitlement to personal data.
  risk_tier: high
  attestation_days: 30
  labels:
    pii-access: "true"
  permissions:
    - server: crm
      tools: ["search_*", "get_*", "export_customers"]
---
apiVersion: agentgov/v1alpha1
kind: Blueprint
metadata:
  name: billing
spec:
  description: Agents that answer billing questions other agents hand them over A2A.
  risk_tier: medium
  require_sponsor: true
  attestation_days: 90
  # No client secrets: its agents authenticate as their workloads (docs/agent-identity.md).
  require_workload_identity: true
  # Its agents may see customers' contact details, to bill them. The agents they answer
  # may not, so the gateway masks them in their answers (docs/agent-to-agent.md).
  labels:
    pii-access: "true"
  permissions:
    - server: crm
      tools: [get_customer]
  acts_for: either
---
apiVersion: agentgov/v1alpha1
kind: Blueprint
metadata:
  name: coding-assistants
spec:
  description: Developers' MCP clients on their machines, acting for the developer signed in.
  risk_tier: medium
  attestation_days: 90
  permissions:
    - server: crm
      tools: [search_customers, get_customer]
  # Only for people (they sign in to its agents: docs/developer-tools.md), and only for
  # developers.
  acts_for: people
  people_groups: [developers]
