# Management rules (docs/management-rules.md): what to do about agents that meet some
# conditions for long enough. They are monitored, so they record what they would do and
# change nothing: preview them (agentgov rules preview NAME), then enforce the
# management-rules feature and each rule you want to act.
apiVersion: agentgov/v1alpha1
kind: ManagementRule
metadata:
  name: inactive-agents
spec:
  description: Block agents nobody has used for 90 days
  conditions:
    inactive_days: 90
  action: block
  after_days: 14
---
apiVersion: agentgov/v1alpha1
kind: ManagementRule
metadata:
  name: ownerless-agents
spec:
  description: Block agents left without an owner, two weeks after telling their sponsors and team
  # Nobody answers for an agent without an owner. To give such agents to a team instead,
  # use action: assign_owner with params: {owner: ai-governance}. Agents on other platforms
  # are told about rather than blocked: block them in the platform's admin center.
  conditions:
    missing: [owner]
    status: [active]
  action: block
  after_days: 14
---
apiVersion: agentgov/v1alpha1
kind: ManagementRule
metadata:
  name: stale-registrations
spec:
  description: Delete registrations nobody approved within 30 days
  conditions:
    status: [pending]
  action: delete
  after_days: 30
---
apiVersion: agentgov/v1alpha1
kind: ManagementRule
metadata:
  name: expired-access
spec:
  description: Revoke access packages a week after they expired, unless renewed
  conditions:
    findings: [access.expired]
  action: revoke_access
  after_days: 7
