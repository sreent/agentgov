# Agents: each gets its own Keycloak client when it becomes active.
apiVersion: agentgov/v1alpha1
kind: Agent
metadata:
  name: support-bot
spec:
  description: Answers customer tickets and keeps CRM notes up to date.
  blueprint: customer-support
  owner: cx-platform
  sponsors: [alice@example.com]
  framework: mcp-python-sdk
  environment: prod
  agent_card:
    name: support-bot
    description: Answers customer tickets and keeps CRM notes up to date.
    version: "1.0.0"
    capabilities: {streaming: false, pushNotifications: false}
    defaultInputModes: [text/plain]
    defaultOutputModes: [text/plain]
    skills:
      - id: ticket-triage
        name: Ticket triage
        description: Look up the customer behind a ticket and record the outcome.
        tags: [support, crm]
  status: active
---
# An agent other agents call (examples/agents/billing). It serves A2A at its a2a_url,
# which only the gateway reaches: agents call it at /a2a/billing-agent on the gateway,
# as their blueprints' agent_access allows. It has no secret: it authenticates with its
# service account token from the demo cluster (identity.yaml).
apiVersion: agentgov/v1alpha1
kind: Agent
metadata:
  name: billing-agent
spec:
  description: Answers billing questions about customers that other agents hand it.
  blueprint: billing
  owner: finance-platform
  sponsors: [bob@example.com]
  framework: a2a
  environment: prod
  workload_identity: {issuer: demo-cluster, subject: "system:serviceaccount:agents:billing-agent"}
  a2a_url: http://billing-agent:9600
  status: active
