# Identity issuers whose tokens agents authenticate with instead of a client secret
# (docs/agent-identity.md). Each agent names its subject there in its spec:
#
#   workload_identity: {issuer: demo-cluster, subject: system:serviceaccount:agents:support-bot}
#
# This one stands in for a Kubernetes cluster's service account issuer (the demo server
# in examples/identity/workload-issuer). A real cluster's issuer is the iss of its tokens:
# the cloud's OpenID Connect issuer on GKE, AKS and EKS, or
# https://kubernetes.default.svc.cluster.local on kind and kubeadm.
apiVersion: agentgov/v1alpha1
kind: IdentityIssuer
metadata:
  name: demo-cluster
spec:
  kind: kubernetes
  issuer: http://workload-issuer:9200
  description: Stand-in Kubernetes cluster (demo server in examples/identity/workload-issuer).
  status: approved
  # The gateway takes its tokens itself too, without Keycloak, for the gateway's address as
  # their audience (docs/agent-identity.md#straight-to-the-gateway):
  # gateway: true
# Other kinds:
#
#   kind: spiffe                     # SPIRE and other SPIFFE implementations' JWT-SVIDs
#   issuer: spiffe://example.org     # the trust domain
#   keys_url: https://spire-bundle.example.org   # its bundle endpoint
#
#   kind: oidc                       # Microsoft Entra ID (Agent ID), Okta, AWS, Google...
#   issuer: https://login.microsoftonline.com/<tenant ID>/v2.0
#   audience: <client ID>            # the API registration's: what Entra ID's v2 tokens carry
#   allow_reuse: true                # Entra ID's tokens have no jti to take each once
#   gateway: true                    # agents call the gateway with these tokens too
