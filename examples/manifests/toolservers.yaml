# MCP servers published through the gateway at http://<gateway>/mcp/<name>, and listed
# for developers in the MCP registry their MCP clients read (docs/developer-tools.md).
apiVersion: agentgov/v1alpha1
kind: ToolServer
metadata:
  name: crm
spec:
  url: http://crm-mcp:9000/mcp
  description: Customer records (demo server in examples/mcp-servers/crm).
  owner: crm-team
  trust_level: verified
  data_classification: confidential
  developers: true
  status: approved
---
# Only for developers: not published on the gateway, listed in the MCP registry as the
# package developers run on their machines.
apiVersion: agentgov/v1alpha1
kind: ToolServer
metadata:
  name: playwright
spec:
  description: Browser automation for coding assistants.
  owner: developer-experience
  gateway: false
  developers: true
  packages:
    - registry_type: npm
      identifier: "@playwright/mcp"
      version: 0.0.41
  status: approved
---
# Outside the gateway: a server with an authorization server of its own. Agents reach it
# directly, with an access token they get there for an identity assertion (ID-JAG) AgentGov
# gives them, as their grants allow, while the identity-assertions feature is on
# (docs/acting-for-people.md#mcp-servers-outside-the-gateway).
apiVersion: agentgov/v1alpha1
kind: ToolServer
metadata:
  name: wiki
spec:
  url: https://wiki.example.com/mcp
  description: The company wiki's MCP server, which its own team runs.
  owner: knowledge-team
  gateway: false
  authorization_server: https://id.wiki.example.com/realms/wiki
  # The client AgentGov's agents are at that authorization server.
  oauth_client_id: agentgov-agents
  status: approved
