[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentgov"
dynamic = ["version"]
description = "Open-source control plane for AI agent governance, composed from Keycloak, OPA, agentgateway, Presidio and OpenTelemetry."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AgentGov contributors" }]
keywords = [
  "ai-agents",
  "governance",
  "mcp",
  "opa",
  "keycloak",
  "agentgateway",
  "agent-identity",
  "audit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  # The API, moving from FastAPI to Django and Django Ninja (docs/adr/0007-django.md):
  # Django 5.2 is the long-term release that runs on Python 3.11, and agentgov.web's
  # threaded views build on Ninja's path views, so its minor version is held.
  "django>=5.2.18,<6",
  "django-ninja>=1.7.1,<1.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.47",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  # The database schema's migrations (agentgov/migrations).
  "alembic>=1.16",
  "httpx>=0.27",
  # The calls-around-the-gateway test's own connections (agentgov.registry.reachability).
  "httpcore>=1.0",
  # Validates identity-provider tokens for administrator single sign-on.
  "pyjwt[crypto]>=2.10",
  "pyyaml>=6.0",
  "typer>=0.12",
  # Governance processor: agentgateway's ExtMcp gRPC protocol.
  "grpcio>=1.84",
  "protobuf>=7.35.1,<8",
  # Time zones for the issues' daily digest, where the system has none (slim images).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
otlp-protobuf = ["opentelemetry-proto>=1.30"]
# Runs examples/agents/demo_agent.py (MCP Python SDK 2.x client).
demo = ["mcp>=2.3,<3"]
dev = [
  "pytest>=8.0",
  "ruff==0.17.0",
  "jsonschema>=4.22",
  "grpcio-tools>=1.84",
  "opentelemetry-proto>=1.30",
  "mcp>=2.3,<3",
]

[project.scripts]
agentgov = "agentgov.cli:main"

[project.urls]
Homepage = "https://github.com/sreent/ai-agent-governance-platform"
Documentation = "https://github.com/sreent/ai-agent-governance-platform/tree/main/docs"
Issues = "https://github.com/sreent/ai-agent-governance-platform/issues"

[tool.hatch.version]
path = "src/agentgov/__init__.py"

[tool.hatch.build]
# The admin UI, built from ui/ into the package (npm run build there): not in git.
artifacts = ["src/agentgov/ui"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgov"]

[tool.hatch.build.targets.sdist]
include = ["src/agentgov", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/agentgov/processor/proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI dependency injection uses calls in defaults
  "S101",   # asserts are fine in tests
  "RUF012", # mutable class attributes are idiomatic for SQLAlchemy/pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607"]
"examples/**" = ["S105", "S106", "S603", "S607", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["agentgov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests share helpers through `tests.conftest`, whichever way pytest is launched.
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  # The CLI sets a longer timeout for slow calls; the in-process test client ignores it.
  "ignore:You should not use the 'timeout' argument with the TestClient",
]
