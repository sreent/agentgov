// A subset of Envoy's external processing API (Apache-2.0), which agentgateway's extProc
// policy speaks:
// https://github.com/envoyproxy/envoy/blob/main/api/envoy/service/ext_proc/v3/external_processor.proto
// The messages it takes from other Envoy packages (HeaderMap, HeaderValue,
// HeaderValueOption, Metadata, HttpStatus) are copied into this package: protobuf's wire
// format carries field numbers and types, not message names. Fields AgentGov doesn't use
// are left out, and ignored when they arrive. Field numbers are Envoy's.
// Regenerate the Python stubs with: scripts/gen-protos.sh

syntax = "proto3";

package envoy.service.ext_proc.v3;

import "google/protobuf/struct.proto";

service ExternalProcessor {
  rpc Process(stream ProcessingRequest) returns (stream ProcessingResponse);
}

message ProcessingRequest {
  oneof request {
    HttpHeaders request_headers = 2;
    HttpHeaders response_headers = 3;
    HttpBody request_body = 4;
    HttpBody response_body = 5;
    HttpTrailers request_trailers = 6;
    HttpTrailers response_trailers = 7;
  }
  Metadata metadata_context = 8;
  bool observability_mode = 10;
}

message ProcessingResponse {
  oneof response {
    HeadersResponse request_headers = 1;
    HeadersResponse response_headers = 2;
    BodyResponse request_body = 3;
    BodyResponse response_body = 4;
    TrailersResponse request_trailers = 5;
    TrailersResponse response_trailers = 6;
    ImmediateResponse immediate_response = 7;
  }
}

message HttpHeaders {
  HeaderMap headers = 1;
  bool end_of_stream = 3;
}

message HttpBody {
  bytes body = 1;
  bool end_of_stream = 2;
}

message HttpTrailers {
  HeaderMap trailers = 1;
}

message HeadersResponse {
  CommonResponse response = 1;
}

message BodyResponse {
  CommonResponse response = 1;
}

message TrailersResponse {
  HeaderMutation header_mutation = 1;
}

message CommonResponse {
  enum ResponseStatus {
    CONTINUE = 0;
    CONTINUE_AND_REPLACE = 1;
  }
  ResponseStatus status = 1;
  HeaderMutation header_mutation = 2;
  BodyMutation body_mutation = 3;
}

message BodyMutation {
  oneof mutation {
    bytes body = 1;
    bool clear_body = 2;
    StreamedBodyResponse streamed_response = 3;
  }
}

message StreamedBodyResponse {
  bytes body = 1;
  bool end_of_stream = 2;
}

message HeaderMutation {
  repeated HeaderValueOption set_headers = 1;
  repeated string remove_headers = 2;
}

message ImmediateResponse {
  HttpStatus status = 1;
  HeaderMutation headers = 2;
  bytes body = 3;
  string details = 5;
}

// envoy.type.v3.HttpStatus (its code is an enum there: the same varint on the wire).
message HttpStatus {
  int32 code = 1;
}

// envoy.config.core.v3.HeaderValue
message HeaderValue {
  string key = 1;
  string value = 2;
  bytes raw_value = 3;
}

// envoy.config.core.v3.HeaderValueOption
message HeaderValueOption {
  enum HeaderAppendAction {
    APPEND_IF_EXISTS_OR_ADD = 0;
    ADD_IF_ABSENT = 1;
    OVERWRITE_IF_EXISTS_OR_ADD = 2;
    OVERWRITE_IF_EXISTS = 3;
  }
  HeaderValue header = 1;
  HeaderAppendAction append_action = 3;
}

// envoy.config.core.v3.HeaderMap
message HeaderMap {
  repeated HeaderValue headers = 1;
}

// envoy.config.core.v3.Metadata
message Metadata {
  map<string, google.protobuf.Struct> filter_metadata = 1;
}
