# Brings up the full reference stack (Keycloak, OPA, agentgateway, Presidio,
# OTel Collector, control plane, processor, demo MCP server) and drives every
# governance control with a real MCP client. Heavier than ci.yml, so it runs on
# main and on demand.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTGOV_URL: http://localhost:8000
      AGENTGOV_TOKEN: dev-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait --wait-timeout 600
      - run: pip install -e ".[demo]"
      - name: Register the demo blueprint, tool server, agent and policy
        run: agentgov apply -f examples/manifests
      - name: Run the governance walkthrough
        run: python examples/agents/demo_agent.py
      - name: Verify the evidence ledger
        run: agentgov ledger verify
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 200
