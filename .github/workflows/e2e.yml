# Brings up the full reference stack (Keycloak, OPA, agentgateway, Presidio,
# OTel Collector, control plane, processor, demo MCP server) and drives every
# governance control with a real MCP client: with Docker Compose and from the Helm
# chart's pods on Docker (scripts/ci.sh --e2e-only, as run locally), and from the
# chart on a kind cluster (scripts/ci.sh --kind-only). Runs on main, on pull
# requests that change code or the deployment, and on demand.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "deploy/**"
      - "examples/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "scripts/ci.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Compose stack and chart pods, demo and ledger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: scripts/ci.sh --e2e-only

  kubernetes:
    name: Helm chart on kind, demo and ledger
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: scripts/ci.sh --kind-only
