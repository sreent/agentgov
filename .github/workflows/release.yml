# Publishes a release when a version tag is pushed (git tag v0.1.0 && git push origin
# v0.1.0): the AgentGov image for amd64 and arm64 to ghcr.io/<owner>/agentgov, and
# the Helm chart to oci://ghcr.io/<owner>/charts/agentgov. The tag must match the
# package version (src/agentgov/__init__.py) and the chart's appVersion.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Image and Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the versions in the repository
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/agentgov/__init__.py)
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/agentgov/Chart.yaml)
          if [ "$version" != "$package" ] || [ "$version" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package $package, chart appVersion $app"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/agentgov
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Push the chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/agentgov --version "${{ steps.version.outputs.version }}"
          helm push "agentgov-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ steps.version.outputs.owner }}/charts"
