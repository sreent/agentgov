# Runs scripts/ci.sh, the same checks contributors run locally: ruff, opa
# fmt/check/test and pytest on each supported Python, plus the image build and
# smoke test once.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.12 and image
            python-version: "3.12"
            args: ""
          - name: Python 3.11
            python-version: "3.11"
            args: --quick
          - name: Python 3.13
            python-version: "3.13"
            args: --quick
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: scripts/ci.sh ${{ matrix.args }}
